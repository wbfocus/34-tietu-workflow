<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6：三张视图 · 亮色高级刊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <style>
    html,body{margin:0;padding:0;background:#faf8f5;overflow:hidden}
    .ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
    .wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
    .card-premium{
      background:#fff;border-radius:16px;border:1px solid transparent;background-clip:padding-box;position:relative;
      box-shadow:0 1px 2px rgba(13,37,61,.04),0 8px 24px rgba(14,165,233,.1),0 24px 48px rgba(14,165,233,.05);
    }
    .card-premium::before{
      content:'';position:absolute;inset:0;border-radius:16px;padding:1px;
      background:linear-gradient(135deg,#BAE6FD,#0EA5E9 40%,#FF7700 80%,#BAE6FD);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }
    .card-featured{
      background:linear-gradient(135deg,#fff 0%,#FFF4E6 100%);border-radius:16px;
      box-shadow:0 1px 2px rgba(255,119,0,.08),0 8px 32px rgba(255,119,0,.15),0 0 60px rgba(255,119,0,.08);
      border:1px solid rgba(255,119,0,.2);border-top:2px solid rgba(255,255,255,.9);
    }
    .card-inner{background:#faf8f5;border-radius:12px;border:1px solid #BAE6FD}
    .badge{background:#E0F2FE;color:#0284C7;border:1px solid #BAE6FD;border-radius:9999px}
  </style>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] flex flex-col relative box-border overflow-hidden wenkai px-10 py-9">
  <div class="flex justify-between items-center mb-6">
    <span class="badge px-7 py-3 text-[26px] ui-bold"># 经营分析三张视图</span>
    <span class="text-[#1C1917] text-[28px] ui-bold">06 / 08</span>
  </div>

  <h1 class="text-[54px] text-[#1C1917] leading-[1.12] ui-bold mb-6">模型建好后，<span class="text-[#0284C7]">固定出这三张</span></h1>

  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="card-premium p-6 bg-[#E0F2FE]/40 relative">
      <div class="text-[#0284C7] ui-bold text-[30px] mb-3">① 摘要仪表盘</div>
      <div class="text-[#1C1917] text-[26px] ui-bold mb-2">战果与警报</div>
      <div class="text-[#1C1917] text-[24px]">时间 + 公司/事业部</div>
    </div>
    <div class="card-premium p-6 relative">
      <div class="text-[#0284C7] ui-bold text-[30px] mb-3">② 结构拆解</div>
      <div class="text-[#1C1917] text-[26px] ui-bold mb-2">钱从哪来、亏在哪</div>
      <div class="text-[#1C1917] text-[24px]">产品/客户/区域</div>
    </div>
    <div class="card-premium p-6 relative">
      <div class="text-[#0284C7] ui-bold text-[30px] mb-3">③ 异常 TOP</div>
      <div class="text-[#1C1917] text-[26px] ui-bold mb-2">下一步查谁</div>
      <div class="text-[#1C1917] text-[24px]">低毛利客户/负毛利订单</div>
    </div>
  </div>

  <div class="card-premium p-7 flex-1 flex flex-col relative">
    <h3 class="text-[32px] text-[#0284C7] ui-bold mb-5">对照 5 类厂：模型侧重不同</h3>
    <div class="flex flex-col gap-4 flex-1">
      <div class="card-inner p-5 flex gap-5 items-center">
        <span class="badge px-5 py-3 text-[24px] ui-bold flex-shrink-0 rounded-lg">A 核算补课型</span>
        <span class="text-[#1C1917] text-[26px]">先只做 Dim_时间 + 单一 Fact，别假拆</span>
      </div>
      <div class="card-inner p-5 flex gap-5 items-center">
        <span class="badge px-5 py-3 text-[24px] ui-bold flex-shrink-0 rounded-lg">B 按单离散型</span>
        <span class="text-[#1C1917] text-[26px]">Fact 粒度到订单/出货行</span>
      </div>
      <div class="card-inner p-5 flex gap-5 items-center">
        <span class="badge px-5 py-3 text-[24px] ui-bold flex-shrink-0 rounded-lg">C 标准量产型</span>
        <span class="text-[#1C1917] text-[26px]">标准/实际成本双度量</span>
      </div>
      <div class="card-inner p-5 flex gap-5 items-center">
        <span class="badge px-5 py-3 text-[24px] ui-bold flex-shrink-0 rounded-lg">D/E 多厂集团</span>
        <span class="text-[#1C1917] text-[26px]">Dim_组织必做，分摊规则写进 PQ</span>
      </div>
    </div>
  </div>

  <div class="card-featured p-6 mt-5">
    <p class="text-[26px] text-[#1C1917]"><span class="text-[#FF7700] ui-bold">📌 收藏属性：</span>星型图 + 本表，打印贴财务办公室。</p>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[22px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none select-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
