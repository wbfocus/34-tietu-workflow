<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P8：写在最后 · 亮色高级刊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <style>
    html,body{margin:0;padding:0;background:#faf8f5;overflow:hidden}
    .ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
    .wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
    .mesh{
      background:
        radial-gradient(ellipse 90% 70% at 10% 0%, rgba(245,233,212,.95) 0%, transparent 50%),
        radial-gradient(ellipse 70% 60% at 50% 5%, rgba(186,230,253,.8) 0%, transparent 45%),
        radial-gradient(ellipse 60% 50% at 85% 10%, rgba(255,119,0,.12) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 70% 30%, rgba(83,58,253,.08) 0%, transparent 45%),
        linear-gradient(180deg,#f0f9ff 0%,#faf8f5 45%,#faf8f5 100%);
    }
    .card-premium{
      background:#fff;border-radius:16px;border:1px solid transparent;background-clip:padding-box;position:relative;
      box-shadow:0 1px 2px rgba(13,37,61,.04),0 8px 24px rgba(14,165,233,.1),0 24px 48px rgba(14,165,233,.05);
    }
    .card-premium::before{
      content:'';position:absolute;inset:0;border-radius:16px;padding:1px;
      background:linear-gradient(135deg,#BAE6FD,#0EA5E9 40%,#FF7700 80%,#BAE6FD);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }
    .num-glow{color:#FF7700;text-shadow:0 4px 24px rgba(255,119,0,.35),0 0 60px rgba(255,119,0,.2)}
    .noise{opacity:.03;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
  </style>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] flex flex-col relative box-border overflow-hidden wenkai">
  <div class="mesh h-[280px] flex-shrink-0 relative">
    <div class="absolute inset-0 noise pointer-events-none"></div>
    <div class="flex justify-between items-start px-10 pt-9 relative z-10">
      <span class="bg-white/80 backdrop-blur-md px-7 py-3 rounded-full text-[26px] text-[#0284C7] ui-bold tracking-wide border border-white shadow-[0_4px_20px_rgba(14,165,233,.12)]">老汪出品 · 必是精品</span>
      <span class="text-[#1C1917] text-[28px] ui-bold">08 / 08</span>
    </div>
  </div>

  <div class="flex-1 px-10 flex flex-col justify-center items-center pb-16 -mt-12 relative z-10">
    <p class="text-[56px] text-[#0284C7] ui-bold text-center leading-[1.15] mb-12">先有对象和口径，<br/>再有公式和图表。</p>

    <div class="card-premium px-10 py-8 max-w-[920px] w-full mb-6 relative">
      <p class="text-[28px] text-[#1C1917] text-center leading-relaxed">
        <span class="text-[#0284C7] ui-bold">最小星型模型：</span>Fact + Dim（时间/组织/客户/产品）+ <span class="ui-bold">口径 1 页</span>
      </p>
    </div>

    <div class="card-premium px-10 py-8 max-w-[920px] w-full mb-12 relative">
      <p class="text-[28px] text-[#1C1917] text-center leading-relaxed">
        <span class="text-[#0284C7] ui-bold">PQ→PP→CUBE：</span>洗表 → 关系与度量 → <span class="ui-bold">CEO 视图</span>
      </p>
    </div>

    <div class="rounded-2xl p-[3px] bg-gradient-to-r from-[#0EA5E9] via-[#0284C7] to-[#FF7700] shadow-[0_16px_48px_rgba(14,165,233,.18)] max-w-[920px] w-full">
      <div class="bg-white rounded-[13px] px-12 py-9 text-center">
        <div class="text-[28px] text-[#1C1917] ui-bold mb-3">点赞 · 收藏 · 转发给</div>
        <div class="text-[42px] text-[#1C1917] ui-bold leading-tight">还在半年会前 <span class="num-glow text-[52px]">VLOOKUP</span> 的同事</div>
      </div>
    </div>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[22px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none select-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
