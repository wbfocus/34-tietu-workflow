<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3：三大误区 · 亮色高级刊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <style>
    html,body{margin:0;padding:0;background:#faf8f5;overflow:hidden}
    .ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
    .wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
    .card-premium{
      background:#fff;border-radius:16px;border:1px solid transparent;background-clip:padding-box;position:relative;
      box-shadow:0 1px 2px rgba(13,37,61,.04),0 8px 24px rgba(14,165,233,.1),0 24px 48px rgba(14,165,233,.05);
    }
    .card-premium::before{
      content:'';position:absolute;inset:0;border-radius:16px;padding:1px;
      background:linear-gradient(135deg,#BAE6FD,#0EA5E9 40%,#FF7700 80%,#BAE6FD);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }
    .card-flaw{background:#FFF4E6;border-radius:12px;border:1px solid rgba(255,119,0,.25)}
    .badge{background:#E0F2FE;color:#0284C7;border:1px solid #BAE6FD;border-radius:9999px}
  </style>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] flex flex-col relative box-border overflow-hidden wenkai px-10 py-9">
  <div class="flex justify-between items-center mb-7">
    <span class="badge px-7 py-3 text-[26px] ui-bold"># 三大误区</span>
    <span class="text-[#1C1917] text-[28px] ui-bold">03 / 08</span>
  </div>

  <h1 class="text-[54px] text-[#1C1917] leading-[1.12] ui-bold mb-8">先上大屏 / 先写KPI / 先学DAX<br/><span class="text-[#0284C7]">都点不到根上</span></h1>

  <div class="flex flex-col gap-5 flex-1">
    <div class="card-premium p-7 flex gap-6 border-l-4 border-l-red-400 relative">
      <div class="w-[72px] h-[72px] bg-red-50 rounded-xl flex items-center justify-center text-[44px] flex-shrink-0">📺</div>
      <div class="flex-1">
        <div class="text-[#1C1917] text-[32px] ui-bold mb-3">先上大屏</div>
        <div class="text-[#1C1917] text-[26px] mb-4">会议室里听到：「买个 BI 就有 CEO 看板」</div>
        <div class="card-flaw px-5 py-4 text-[#FF7700] text-[26px] ui-bold">实际缺：源表未清洗、口径未统一，大屏只能看总额</div>
      </div>
    </div>
    <div class="card-premium p-7 flex gap-6 border-l-4 border-l-amber-400 relative">
      <div class="w-[72px] h-[72px] bg-amber-50 rounded-xl flex items-center justify-center text-[44px] flex-shrink-0">📋</div>
      <div class="flex-1">
        <div class="text-[#1C1917] text-[32px] ui-bold mb-3">先写 KPI</div>
        <div class="text-[#1C1917] text-[26px] mb-4">会议室里听到：「指标手册 80 页」</div>
        <div class="card-flaw px-5 py-4 text-[#FF7700] text-[26px] ui-bold">实际缺：事实表粒度没定，算出来各说各话</div>
      </div>
    </div>
    <div class="card-premium p-7 flex gap-6 border-l-4 border-l-violet-400 relative">
      <div class="w-[72px] h-[72px] bg-violet-50 rounded-xl flex items-center justify-center text-[44px] flex-shrink-0">🧮</div>
      <div class="flex-1">
        <div class="text-[#1C1917] text-[32px] ui-bold mb-3">先学 DAX</div>
        <div class="text-[#1C1917] text-[26px] mb-4">会议室里听到：「报班学函数」</div>
        <div class="card-flaw px-5 py-4 text-[#FF7700] text-[26px] ui-bold">实际缺：表关系没建好，公式越写越乱</div>
      </div>
    </div>
  </div>

  <div class="mt-6 rounded-2xl p-[2px] bg-gradient-to-r from-[#0EA5E9] via-[#0284C7] to-[#FF7700]">
    <div class="bg-[#E0F2FE] rounded-[14px] px-8 py-7">
      <p class="text-[28px] text-[#1C1917] leading-relaxed"><span class="text-[#0284C7] ui-bold">本篇立场：</span>制造财务 BP，<span class="ui-bold">第一步是「最小星型模型」</span>——先定事实表+维表+口径规则，再谈指标和可视化。</p>
    </div>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[22px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none select-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
