<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1：封面-落不到车间</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board-cover">
    <!-- 页眉 -->
    <div class="relative">
      <div class="wm-num ui-title">01</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">01</div>
        <div>
          <div class="c-en ui-bold">FIELD</div>
          <div class="c-cn">车间现场</div>
        </div>
      </div>
    </div>

    <!-- 标题 -->
    <div>
      <h1 class="text-[56px] text-[#2A2724] leading-[1.12] ui-title">报表再漂亮<br/>也<span class="text-[#D16C4F]">落不到车间</span></h1>
      <p class="text-[28px] text-[#6B6560] mt-4 leading-relaxed">工厂开得红火、报表做得体面——问一句哪条线在<span class="mark">吞利润</span>，老板答不上来。</p>
    </div>

    <!-- 判断条 -->
    <div class="pill-dark px-8 py-5 flex items-center gap-4">
      <span class="bg-[#D16C4F] text-white text-[22px] ui-bold px-4 py-1.5 rounded-full">判断</span>
      <span class="text-[26px] wenkai leading-snug">坐办公室看月报，那是<span class="mark">事后算账</span></span>
    </div>

    <!-- 大圆数字 -->
    <div class="flex items-center gap-8">
      <div class="hero-orb ui-title text-[92px] leading-none">6</div>
      <div>
        <div class="text-[32px] text-[#2A2724] ui-title leading-tight">六层拆法<br/>把分析送进车间</div>
        <p class="text-[26px] text-[#6B6560] mt-3 leading-relaxed">走进车间看<span class="mark">在制品</span>和<span class="mark-sage">瓶颈工序</span>，那才叫经营。</p>
      </div>
    </div>

    <!-- 目录标签 -->
    <div class="flex flex-wrap gap-3">
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#2A2724] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#6F8A6A]"></span>两张皮</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#2A2724] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#6F8A6A]"></span>拆四刀</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#2A2724] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#6F8A6A]"></span>盯瓶颈</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#2A2724] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#D16C4F]"></span>四问</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#2A2724] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#D16C4F]"></span>事前算赢</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#2A2724] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#C4A46A]"></span>最小动作</span>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>01 / 08 · 封面</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
