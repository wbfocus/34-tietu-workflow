<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1：封面-毛利率差异拆解</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<style>
html,body{margin:0;padding:0;background:#0a0f1a;overflow:hidden}
.ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
.wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
.glass{background:rgba(15,23,42,.62);backdrop-filter:blur(24px);border:1px solid rgba(148,163,184,.22);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden}
.glass-hl{background:linear-gradient(135deg,rgba(14,165,233,.22),rgba(30,58,138,.3));backdrop-filter:blur(20px);border:1px solid rgba(14,165,233,.4);border-top:1px solid rgba(255,255,255,.18);box-shadow:0 0 50px rgba(14,165,233,.18),0 16px 48px rgba(0,0,0,.45);position:relative;overflow:hidden}
.glow-num{text-shadow:0 0 50px rgba(255,119,0,.6),0 0 100px rgba(255,119,0,.3)}
.noise{opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<!-- 最外层画布 -->
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative overflow-hidden box-border wenkai pt-9 pb-20">
<!-- 背景光晕 -->
<div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
<div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
<div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
<div class="absolute right-[-20px] top-[220px] text-[280px] ui-bold text-white opacity-[0.04] leading-none z-[1] select-none">拆</div>
<!-- 页眉 -->
<div class="flex justify-between items-center px-10 relative z-10">
<span class="glass px-7 py-3 rounded-full text-[22px] text-cyan-200 ui-bold">老汪洞察 · 财务专业拆解</span>
<span class="text-slate-400 text-[26px] ui-bold">01 / 08</span>
</div>
<!-- 标题区：左重标题 + 右侧大数字 -->
<div class="px-10 mt-8 relative z-10 flex items-end justify-between gap-6">
<div class="flex-shrink-0 w-[620px]">
<div class="text-[22px] text-cyan-300/70 ui-bold tracking-widest uppercase font-mono mb-3">PRICE · COST · MIX</div>
<h1 class="text-[72px] text-white leading-[1.08] ui-bold">毛利率掉了<br/>别只会说成本升了</h1>
<p class="text-[28px] text-slate-200 wenkai mt-5 leading-relaxed">从结果变化拆到价格、成本与结构根因</p>
</div>
<div class="text-right pb-2">
<div class="text-[#FF7700] text-[132px] ui-bold leading-none glow-num">1.90</div>
<div class="text-slate-300 text-[26px] ui-bold mt-1">百分点 · 案例落差</div>
</div>
</div>
<!-- 瀑布路径 -->
<div class="px-10 mt-7 relative z-10">
<div class="glass rounded-2xl p-6">
<div class="absolute inset-0 noise pointer-events-none"></div>
<div class="relative z-10 flex items-center justify-between gap-3">
<div class="text-center w-[170px]"><div class="text-white text-[40px] ui-bold">31.56%</div><div class="text-slate-300 text-[22px] ui-bold mt-1">基期毛利率</div></div>
<div class="text-slate-500 text-[28px] ui-bold">→</div>
<div class="text-center w-[150px]"><div class="text-cyan-300 text-[32px] ui-bold">价格</div><div class="text-slate-300 text-[22px] ui-bold mt-1">-1.07pp</div></div>
<div class="text-center w-[150px]"><div class="text-[#FF7700] text-[32px] ui-bold">成本</div><div class="text-slate-300 text-[22px] ui-bold mt-1">-1.06pp</div></div>
<div class="text-center w-[150px]"><div class="text-emerald-300 text-[32px] ui-bold">结构</div><div class="text-slate-300 text-[22px] ui-bold mt-1">+0.23pp</div></div>
<div class="text-slate-500 text-[28px] ui-bold">→</div>
<div class="text-center w-[170px]"><div class="text-white text-[40px] ui-bold">29.66%</div><div class="text-slate-300 text-[22px] ui-bold mt-1">本期毛利率</div></div>
</div>
</div>
</div>
<!-- 三步速览 -->
<div class="px-10 mt-5 relative z-10 grid grid-cols-3 gap-4">
<div class="glass rounded-2xl p-6"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10"><div class="w-14 h-14 rounded-xl bg-cyan-500/25 border border-cyan-400/40 flex items-center justify-center text-cyan-300 text-[26px] ui-bold mb-3">01</div><div class="text-white text-[30px] ui-bold mb-1">统一口径</div><div class="text-slate-200 text-[24px] leading-relaxed">额、率、百分点先分开</div></div></div>
<div class="glass rounded-2xl p-6"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10"><div class="w-14 h-14 rounded-xl bg-cyan-500/25 border border-cyan-400/40 flex items-center justify-center text-cyan-300 text-[26px] ui-bold mb-3">02</div><div class="text-white text-[30px] ui-bold mb-1">量化贡献</div><div class="text-slate-200 text-[24px] leading-relaxed">价格 · 成本 · 结构</div></div></div>
<div class="glass-hl rounded-2xl p-6"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10"><div class="w-14 h-14 rounded-xl bg-orange-500/25 border border-orange-400/40 flex items-center justify-center text-[#FF7700] text-[26px] ui-bold mb-3">03</div><div class="text-white text-[30px] ui-bold mb-1">落到动作</div><div class="text-cyan-100 text-[24px] leading-relaxed">下钻责任 · 闭环验证</div></div></div>
</div>
<!-- 金句 -->
<div class="px-10 mt-5 relative z-10">
<div class="glass rounded-2xl px-8 py-6 border-l-[6px] border-l-[#0EA5E9]">
<div class="absolute inset-0 noise pointer-events-none"></div>
<p class="relative z-10 text-[28px] text-slate-100 leading-relaxed"><span class="text-cyan-300 ui-bold">老汪洞察：</span>先量化贡献，再解释原因。不能先有结论，再去表里找数。</p>
</div>
</div>
<!-- 水印 -->
<div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
