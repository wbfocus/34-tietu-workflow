<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P3：价格成本结构三因子</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<style>
html,body{margin:0;padding:0;background:#0a0f1a;overflow:hidden}
.ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
.wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
.glass{background:rgba(15,23,42,.62);backdrop-filter:blur(24px);border:1px solid rgba(148,163,184,.22);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden}
.glass-hl{background:linear-gradient(135deg,rgba(14,165,233,.22),rgba(30,58,138,.3));backdrop-filter:blur(20px);border:1px solid rgba(14,165,233,.4);border-top:1px solid rgba(255,255,255,.18);box-shadow:0 0 50px rgba(14,165,233,.18),0 16px 48px rgba(0,0,0,.45);position:relative;overflow:hidden}
.noise{opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
<div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
<div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
<div class="flex justify-between items-center px-10 relative z-10">
<span class="glass px-7 py-3 rounded-full text-[22px] text-cyan-200 ui-bold"># 三因子铁律</span>
<span class="text-slate-400 text-[24px] ui-bold">03 / 08</span>
</div>
<div class="px-10 mt-7 relative z-10">
<h1 class="text-[50px] text-white leading-tight ui-bold">综合毛利率只由<br/><span class="text-[#0EA5E9]">价格、成本、结构</span> 决定</h1>
</div>
<!-- 核心公式 featured -->
<div class="px-10 mt-6 relative z-10">
<div class="glass-hl rounded-2xl px-8 py-7 border-l-[6px] border-l-[#0EA5E9]">
<div class="absolute inset-0 noise pointer-events-none"></div>
<div class="relative z-10">
<div class="text-cyan-200 text-[24px] ui-bold mb-2">收入加权平均</div>
<div class="text-white text-[44px] ui-bold leading-tight">GM = Σ ( wᵢ × mᵢ )</div>
<div class="text-slate-200 text-[24px] mt-3 leading-relaxed">wᵢ = 产品收入权重　mᵢ = 1 − cᵢ / pᵢ　Σwᵢ = 100%</div>
</div>
</div>
</div>
<!-- 三效应：宽窄不一 -->
<div class="px-10 mt-5 relative z-10 flex flex-col gap-4">
<div class="glass rounded-2xl p-6 mr-8"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10 flex gap-5 items-start"><div class="w-14 h-14 rounded-xl bg-cyan-500/25 border border-cyan-400/40 flex items-center justify-center text-cyan-300 text-[26px] ui-bold flex-shrink-0">价</div><div><div class="text-white text-[30px] ui-bold">价格效应</div><div class="text-slate-200 text-[24px] mt-1 leading-relaxed">改单价：同时动毛利分子和收入分母</div></div></div></div>
<div class="glass rounded-2xl p-6 ml-8"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10 flex gap-5 items-start"><div class="w-14 h-14 rounded-xl bg-orange-500/20 border border-orange-400/40 flex items-center justify-center text-[#FF7700] text-[26px] ui-bold flex-shrink-0">本</div><div><div class="text-white text-[30px] ui-bold">成本效应</div><div class="text-slate-200 text-[24px] mt-1 leading-relaxed">改单位成本：只动分子，不改销售收入分母</div></div></div></div>
<div class="glass rounded-2xl p-6 mr-8"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10 flex gap-5 items-start"><div class="w-14 h-14 rounded-xl bg-cyan-500/25 border border-cyan-400/40 flex items-center justify-center text-cyan-300 text-[26px] ui-bold flex-shrink-0">构</div><div><div class="text-white text-[30px] ui-bold">结构效应</div><div class="text-slate-200 text-[24px] mt-1 leading-relaxed">收入权重在高低毛利业务之间迁移</div></div></div></div>
</div>
<div class="px-10 mt-5 relative z-10">
<div class="glass rounded-2xl px-7 py-6">
<div class="absolute inset-0 noise pointer-events-none"></div>
<p class="relative z-10 text-[26px] text-slate-100 leading-relaxed"><span class="text-cyan-300 ui-bold">销量不是独立驱动率：</span>单品销量涨，自身毛利率不变；只有改变收入权重时，才会进结构效应。销量主要驱动的是毛利额。</p>
</div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
