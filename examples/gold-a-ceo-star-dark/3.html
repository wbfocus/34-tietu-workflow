<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3：三大误区-深色</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">03</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">03</div>
        <div>
          <div class="c-en ui-bold">TRAP</div>
          <div class="c-cn">三大误区</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">先上大屏 / 先写KPI / 先学DAX<br/><span class="text-[#0EA5E9]">都点不到根上</span></h1>
      <p class="text-[26px] text-slate-300 mt-3">会议室里的三句话，缺的都是<span class="mark">模型和口径</span>。</p>
    </div>
    <div class="grid grid-cols-1 gap-4">
      <div class="card-paper p-6 flex items-start gap-5">
        <div class="dot-n terra ui-bold">✕</div>
        <div>
          <div class="text-[28px] text-white ui-title">先上大屏</div>
          <p class="text-[24px] text-slate-300 mt-1 leading-relaxed">「买个 BI 就有 CEO 看板」。实际缺：源表未清洗、口径未统一，大屏只能看<span class="mark">总额</span>。</p>
        </div>
      </div>
      <div class="card-paper p-6 flex items-start gap-5">
        <div class="dot-n ochre ui-bold">✕</div>
        <div>
          <div class="text-[28px] text-white ui-title">先写 KPI</div>
          <p class="text-[24px] text-slate-300 mt-1 leading-relaxed">「指标手册 80 页」。实际缺：事实表<span class="mark">粒度没定</span>，算出来各说各话。</p>
        </div>
      </div>
      <div class="card-paper p-6 flex items-start gap-5">
        <div class="dot-n sage ui-bold">✕</div>
        <div>
          <div class="text-[28px] text-white ui-title">先学 DAX</div>
          <p class="text-[24px] text-slate-300 mt-1 leading-relaxed">「报班学函数」。实际缺：<span class="mark-sage">表关系没建好</span>，公式越写越乱。</p>
        </div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>第一步是「<span class="mark">最小星型模型</span>」——先定事实表+维表+口径，再谈指标和可视化。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>03 / 08 · 误区</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
