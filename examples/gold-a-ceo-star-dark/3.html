<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P3：三大误区-深色</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<style>
html,body{margin:0;padding:0;background:#0a0f1a;overflow:hidden}
.ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
.wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
.glass{background:rgba(15,23,42,.62);backdrop-filter:blur(24px);border:1px solid rgba(148,163,184,.22);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden}
.glass-hl{background:linear-gradient(135deg,rgba(14,165,233,.22),rgba(30,58,138,.3));backdrop-filter:blur(20px);border:1px solid rgba(14,165,233,.4);border-top:1px solid rgba(255,255,255,.18);box-shadow:0 0 50px rgba(14,165,233,.18),0 16px 48px rgba(0,0,0,.45);position:relative;overflow:hidden}
.flaw-box{background:rgba(255,119,0,.15);border:1px solid rgba(255,119,0,.35);border-radius:10px;position:relative;overflow:hidden}
.noise{opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] flex flex-col relative overflow-hidden wenkai">
<div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
<div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
<div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
<div class="flex justify-between items-center px-10 pt-8 relative z-10">
<span class="glass px-7 py-3 rounded-full text-[22px] text-cyan-200 ui-bold"># 三大误区</span>
<span class="text-slate-400 text-[24px] ui-bold">03 / 08</span>
</div>
<div class="flex-1 px-10 flex flex-col gap-5 py-5 relative z-10 pb-14">
<h1 class="text-[50px] text-white leading-tight ui-bold">先上大屏 / 先写KPI / 先学DAX<br/><span class="text-[#0EA5E9]">都点不到根上</span></h1>
<div class="flex flex-col gap-4 flex-1">
<div class="glass rounded-2xl p-6 flex gap-5 border-l-[6px] border-l-red-400/60">
<div class="absolute inset-0 noise pointer-events-none"></div>
<div class="relative z-10 w-[64px] h-[64px] bg-red-500/20 rounded-xl flex items-center justify-center text-[36px] flex-shrink-0 border border-red-400/30">📺</div>
<div class="relative z-10 flex-1">
<div class="text-white text-[32px] ui-bold mb-2">先上大屏</div>
<div class="text-slate-200 text-[26px] mb-3">会议室里听到：「买个 BI 就有 CEO 看板」</div>
<div class="flaw-box px-4 py-3"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10 text-[#FF7700] text-[24px] ui-bold">实际缺：源表未清洗、口径未统一，大屏只能看总额</div></div>
</div>
</div>
<div class="glass rounded-2xl p-6 flex gap-5 border-l-[6px] border-l-amber-400/60">
<div class="absolute inset-0 noise pointer-events-none"></div>
<div class="relative z-10 w-[64px] h-[64px] bg-amber-500/20 rounded-xl flex items-center justify-center text-[36px] flex-shrink-0 border border-amber-400/30">📋</div>
<div class="relative z-10 flex-1">
<div class="text-white text-[32px] ui-bold mb-2">先写 KPI</div>
<div class="text-slate-200 text-[26px] mb-3">会议室里听到：「指标手册 80 页」</div>
<div class="flaw-box px-4 py-3"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10 text-[#FF7700] text-[24px] ui-bold">实际缺：事实表粒度没定，算出来各说各话</div></div>
</div>
</div>
<div class="glass rounded-2xl p-6 flex gap-5 border-l-[6px] border-l-violet-400/60">
<div class="absolute inset-0 noise pointer-events-none"></div>
<div class="relative z-10 w-[64px] h-[64px] bg-violet-500/20 rounded-xl flex items-center justify-center text-[36px] flex-shrink-0 border border-violet-400/30">🧮</div>
<div class="relative z-10 flex-1">
<div class="text-white text-[32px] ui-bold mb-2">先学 DAX</div>
<div class="text-slate-200 text-[26px] mb-3">会议室里听到：「报班学函数」</div>
<div class="flaw-box px-4 py-3"><div class="absolute inset-0 noise pointer-events-none"></div><div class="relative z-10 text-[#FF7700] text-[24px] ui-bold">实际缺：表关系没建好，公式越写越乱</div></div>
</div>
</div>
</div>
<div class="glass-hl rounded-2xl p-6">
<div class="absolute inset-0 noise pointer-events-none"></div>
<p class="relative z-10 text-[28px] text-slate-100 leading-relaxed"><span class="text-[#0EA5E9] ui-bold">本篇立场：</span>制造财务 BP，<span class="text-white ui-bold">第一步是「最小星型模型」</span>——先定事实表+维表+口径规则，再谈指标和可视化。</p>
</div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
