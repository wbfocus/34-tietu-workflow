<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P7：给CEO三句话-深色</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">07</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">07</div>
        <div>
          <div class="c-en ui-bold">CEO</div>
          <div class="c-cn">三句话</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">模型能刷新<br/><span class="text-[#0EA5E9]">才谈得上经营分析</span></h1>
      <p class="text-[26px] text-slate-300 mt-3">下面三句可直接转发。底下是财务 BP 的<span class="mark">五问自检</span>。</p>
    </div>
    <div class="card-paper p-6 flex items-start gap-5">
      <div class="dot-n terra ui-bold">1</div>
      <div>
        <div class="text-[28px] text-white ui-title">看板不是买软件</div>
        <p class="text-[24px] text-slate-300 mt-1">先有「最小星型模型」——每月同一口径、同一对象。</p>
      </div>
    </div>
    <div class="card-paper p-6 flex items-start gap-5">
      <div class="dot-n sage ui-bold">2</div>
      <div>
        <div class="text-[28px] text-white ui-title">先批口径 1 页</div>
        <p class="text-[24px] text-slate-300 mt-1">请先批准<span class="mark-sage">口径说明</span>，再批大屏预算。</p>
      </div>
    </div>
    <div class="card-paper p-6 flex items-start gap-5">
      <div class="dot-n ochre ui-bold">3</div>
      <div>
        <div class="text-[28px] text-white ui-title">会只看三张</div>
        <p class="text-[24px] text-slate-300 mt-1">摘要、结构、异常 TOP。其它表会后查。</p>
      </div>
    </div>
    <div class="card-blush px-6 py-5">
      <div class="text-[22px] text-[#FF7700] ui-bold mb-3">财务 BP 自检</div>
      <p class="text-[24px] text-slate-100 leading-relaxed">粒度写清了吗 · Dim 编码对齐了吗 · 口径签字了吗 · PQ 能否 <span class="mark">&lt;15 分钟</span>刷新 · 至少 1 个 CUBE 能复用吗</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>07 / 08 · 转发</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
