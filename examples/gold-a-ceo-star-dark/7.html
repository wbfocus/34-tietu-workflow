<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P7：给CEO三句话-深色</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<style>
html,body{margin:0;padding:0;background:#0a0f1a;overflow:hidden}
.ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
.wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
.glass{background:rgba(15,23,42,.62);backdrop-filter:blur(24px);border:1px solid rgba(148,163,184,.22);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden}
.glass-hl{background:linear-gradient(135deg,rgba(14,165,233,.22),rgba(30,58,138,.3));backdrop-filter:blur(20px);border:1px solid rgba(14,165,233,.4);border-top:1px solid rgba(255,255,255,.18);box-shadow:0 0 50px rgba(14,165,233,.18),0 16px 48px rgba(0,0,0,.45);position:relative;overflow:hidden}
.glass-inner{background:rgba(10,15,26,.5);border:1px solid rgba(148,163,184,.15);position:relative;overflow:hidden}
.checkbox{font-size:40px;line-height:1;color:#FF7700;text-shadow:0 0 20px rgba(255,119,0,.4)}
.noise{opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] flex flex-col relative overflow-hidden wenkai">
<div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
<div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
<div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
<div class="flex justify-between items-center px-10 pt-8 relative z-10">
<span class="glass px-7 py-3 rounded-full text-[22px] text-cyan-200 ui-bold"># 给CEO的三句话</span>
<span class="text-slate-400 text-[24px] ui-bold">07 / 08</span>
</div>
<div class="flex-1 px-10 flex flex-col gap-5 py-5 relative z-10 pb-14">
<h1 class="text-[50px] text-white leading-tight ui-bold">模型能刷新，<span class="text-[#0EA5E9]">才谈得上经营分析</span></h1>
<div class="glass-hl rounded-2xl p-7">
<div class="absolute inset-0 noise pointer-events-none"></div>
<div class="relative z-10">
<h3 class="text-[30px] text-[#0EA5E9] ui-bold mb-4">给 CEO（可直接转发）</h3>
<div class="flex flex-col gap-4 text-[26px] text-slate-200 leading-relaxed">
<div class="flex gap-3"><span class="text-[#0EA5E9] ui-bold text-[30px]">1.</span><span><span class="text-white ui-bold">CEO 看板不是买软件</span>，是先有「最小星型模型」——每月同一口径、同一对象。</span></div>
<div class="flex gap-3"><span class="text-[#0EA5E9] ui-bold text-[30px]">2.</span><span>请先批准<span class="text-white ui-bold">口径说明 1 页</span>，再批大屏预算。</span></div>
<div class="flex gap-3"><span class="text-[#0EA5E9] ui-bold text-[30px]">3.</span><span>分析会只看三张：<span class="text-white ui-bold">摘要、结构、异常 TOP</span>。</span></div>
</div>
</div>
</div>
<div class="glass rounded-2xl p-7 flex-1 flex flex-col">
<div class="absolute inset-0 noise pointer-events-none"></div>
<div class="relative z-10 flex flex-col flex-1">
<h3 class="text-[30px] text-[#0EA5E9] ui-bold mb-4">财务 BP 自检 5 项</h3>
<div class="flex flex-col gap-3 flex-1">
<div class="glass-inner rounded-xl p-4 flex items-center gap-4"><div class="absolute inset-0 noise pointer-events-none"></div><span class="relative z-10 checkbox ui-bold">☐</span><span class="relative z-10 text-white text-[26px] ui-bold">Fact 表粒度写在一句话里了吗？</span></div>
<div class="glass-inner rounded-xl p-4 flex items-center gap-4"><div class="absolute inset-0 noise pointer-events-none"></div><span class="relative z-10 checkbox ui-bold">☐</span><span class="relative z-10 text-white text-[26px] ui-bold">四张 Dim 编码与金蝶主数据一致吗？</span></div>
<div class="glass-inner rounded-xl p-4 flex items-center gap-4"><div class="absolute inset-0 noise pointer-events-none"></div><span class="relative z-10 checkbox ui-bold">☐</span><span class="relative z-10 text-white text-[26px] ui-bold">口径文档销售财务签字了吗？</span></div>
<div class="glass-inner rounded-xl p-4 flex items-center gap-4"><div class="absolute inset-0 noise pointer-events-none"></div><span class="relative z-10 checkbox ui-bold">☐</span><span class="relative z-10 text-white text-[26px] ui-bold">PQ 能否一键刷新上月数据（&lt;15分钟）？</span></div>
<div class="glass-inner rounded-xl p-4 flex items-center gap-4"><div class="absolute inset-0 noise pointer-events-none"></div><span class="relative z-10 checkbox ui-bold">☐</span><span class="relative z-10 text-white text-[26px] ui-bold">至少1个 CUBE 或透视视图能复用吗？</span></div>
</div>
</div>
</div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
