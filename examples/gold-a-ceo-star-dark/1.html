<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1：封面-深色</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<style>
html,body{margin:0;padding:0;background:#0a0f1a;overflow:hidden}
.ui-bold{font-family:'HarmonyOS_Sans_SC_Bold','HarmonyOS Sans SC',sans-serif;font-weight:700}
.wenkai{font-family:'LXGW WenKai','霞鹜文楷',serif}
.glass{background:rgba(15,23,42,.62);backdrop-filter:blur(24px);border:1px solid rgba(148,163,184,.22);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.glass-hl{background:linear-gradient(135deg,rgba(14,165,233,.22),rgba(30,58,138,.3));backdrop-filter:blur(20px);border:1px solid rgba(14,165,233,.4);border-top:1px solid rgba(255,255,255,.18);box-shadow:0 0 50px rgba(14,165,233,.18),0 16px 48px rgba(0,0,0,.45)}
.glow-num{text-shadow:0 0 50px rgba(255,119,0,.6),0 0 100px rgba(255,119,0,.3)}
.noise{opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] flex flex-col relative overflow-hidden wenkai">
<div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
<div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
<div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
<div class="flex justify-between items-center px-10 pt-8 relative z-10">
<span class="glass px-7 py-3 rounded-full text-[22px] text-cyan-200 ui-bold">老汪洞察 · 制造业经营分析</span>
<span class="text-slate-400 text-[26px] ui-bold">01 / 08</span>
</div>
<div class="flex-1 px-10 flex flex-col gap-6 py-6 relative z-10 pb-14">
<div class="text-center">
<h1 class="text-[80px] text-white leading-[1.05] ui-bold mb-6">CEO看板从哪建？</h1>
<div class="flex items-center justify-center gap-8">
<span class="text-[#FF7700] text-[150px] ui-bold leading-none glow-num">4</span>
<div class="text-left">
<div class="text-[52px] text-white ui-bold">步搭出最小星型模型</div>
<div class="text-[34px] text-cyan-200 ui-bold mt-2">PQ → PP → CUBE 路线图</div>
</div>
</div>
</div>
<div class="grid grid-cols-4 gap-4 flex-1 content-center">
<div class="glass rounded-2xl p-7 text-center"><div class="w-16 h-16 mx-auto mb-4 rounded-xl bg-cyan-500/25 border-2 border-cyan-400/40 flex items-center justify-center text-cyan-300 text-[32px] ui-bold">01</div><div class="text-white text-[30px] ui-bold mb-2">需求</div><div class="text-slate-200 text-[24px]">对象+粒度+口径</div></div>
<div class="glass rounded-2xl p-7 text-center"><div class="w-16 h-16 mx-auto mb-4 rounded-xl bg-cyan-500/25 border-2 border-cyan-400/40 flex items-center justify-center text-cyan-300 text-[32px] ui-bold">02</div><div class="text-white text-[30px] ui-bold mb-2">架构</div><div class="text-slate-200 text-[24px]">画星型模型图</div></div>
<div class="glass rounded-2xl p-7 text-center"><div class="w-16 h-16 mx-auto mb-4 rounded-xl bg-cyan-500/25 border-2 border-cyan-400/40 flex items-center justify-center text-cyan-300 text-[32px] ui-bold">03</div><div class="text-white text-[30px] ui-bold mb-2">清洗</div><div class="text-slate-200 text-[24px]">Power Query</div></div>
<div class="glass-hl rounded-2xl p-7 text-center"><div class="w-16 h-16 mx-auto mb-4 rounded-xl bg-orange-500/30 border-2 border-orange-400/50 flex items-center justify-center text-[#FF7700] text-[32px] ui-bold">04</div><div class="text-white text-[30px] ui-bold mb-2">呈现</div><div class="text-cyan-100 text-[24px]">PP + CUBE</div></div>
</div>
<div class="glass rounded-2xl px-10 py-8 border-l-[6px] border-l-[#0EA5E9]">
<p class="text-[30px] text-slate-100 leading-relaxed text-center"><span class="text-cyan-300 ui-bold">老汪洞察：</span>经营分析会拆到客户/产品/工厂，财务却每月靠<span class="text-white ui-bold">VLOOKUP拼表</span>？先建<span class="text-white ui-bold">最小星型模型</span>，再谈指标和大屏。</p>
</div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
