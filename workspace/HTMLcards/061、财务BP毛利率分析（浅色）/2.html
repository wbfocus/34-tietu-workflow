<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2：说得对但没用</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">02</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">02</div>
        <div>
          <div class="c-en sage ui-bold">GAP</div>
          <div class="c-cn">经营会上</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-[#1C1917] leading-[1.12] ui-title">同比环比都标红了<br/>往下走就断了</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">左边是会上常交的卷，右边是业务真正要的。</p>
    </div>
    <div class="card-blush px-6 py-5">
      <p class="text-[26px] text-[#1C1917] leading-relaxed">业务负责人看一眼：「这些话<span class="mark">我自己也会说</span>。」潜台词是：你说得对，但没用。</p>
    </div>
    <div class="card-paper overflow-hidden">
      <div class="grid grid-cols-[1fr_36px_1fr] items-center">
        <div class="px-5 py-5 flex items-center gap-3">
          <span class="x-mark ui-bold">✕</span>
          <span class="text-[24px] text-[#1C1917]">毛利率降了、成本高了</span>
        </div>
        <div class="text-[#9A938C] text-[22px] ui-bold text-center">→</div>
        <div class="px-5 py-5 flex items-center gap-3 fix-bg h-full">
          <span class="ok-mark ui-bold">✓</span>
          <span class="text-[24px] text-[#1C1917]">告诉他<span class="mark-sage">下一步干什么</span></span>
        </div>
      </div>
    </div>
    <div class="card-paper overflow-hidden">
      <div class="grid grid-cols-[1fr_36px_1fr] items-center">
        <div class="px-5 py-5 flex items-center gap-3">
          <span class="x-mark ui-bold">✕</span>
          <span class="text-[24px] text-[#1C1917]">报告写「建议关注」</span>
        </div>
        <div class="text-[#9A938C] text-[22px] ui-bold text-center">→</div>
        <div class="px-5 py-5 flex items-center gap-3 fix-bg h-full">
          <span class="ok-mark ui-bold">✓</span>
          <span class="text-[24px] text-[#1C1917]">给一个能落地的动作</span>
        </div>
      </div>
    </div>
    <div class="card-paper overflow-hidden">
      <div class="grid grid-cols-[1fr_36px_1fr] items-center">
        <div class="px-5 py-5 flex items-center gap-3">
          <span class="x-mark ui-bold">✕</span>
          <span class="text-[24px] text-[#1C1917]">第一反应只去查成本</span>
        </div>
        <div class="text-[#9A938C] text-[22px] ui-bold text-center">→</div>
        <div class="px-5 py-5 flex items-center gap-3 fix-bg h-full">
          <span class="ok-mark ui-bold">✓</span>
          <span class="text-[24px] text-[#1C1917]">先看<span class="mark-sage">结构</span>有没有变</span>
        </div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-[#1C1917] leading-relaxed"><span class="mark ui-title">原则：</span>做得好是军师，做不好就是帮业务把数字念一遍。差距在<span class="mark">从分到动作</span>这条链。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>02 / 08 · 痛点</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
