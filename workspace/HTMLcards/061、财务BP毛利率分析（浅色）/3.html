<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3：结构拖利润</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">03</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">03</div>
        <div>
          <div class="c-en ui-bold">MIX</div>
          <div class="c-cn">结构变化</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-[#1C1917] leading-[1.12] ui-title">单品毛利率都没变<br/>整体却从 26% 掉到 22%</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">两款产品：A 毛利率 30%，B 毛利率 10%。查成本查到天黑也查不出。</p>
    </div>
    <div class="hl-bar px-6 py-5">
      <div class="text-[22px] text-[#9A938C] ui-bold">上月加权</div>
      <div class="text-[26px] text-[#1C1917] ui-title mt-1">（80×30% ＋ 20×10%）÷ 100 ＝ <span class="mark-sage">26%</span></div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-[#1C1917]">A 上月销量</span>
        <span class="text-[28px] text-[#1C1917] ui-bold">80 万</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-[#1C1917]">A 本月销量</span>
        <span class="text-[28px] text-[#1C1917] ui-bold">60 万</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-[#1C1917]">B 上月销量</span>
        <span class="text-[28px] text-[#1C1917] ui-bold">20 万</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-[#1C1917]">B 本月销量</span>
        <span class="text-[28px] text-[#1C1917] ui-bold">40 万</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-[#1C1917]">上月整体</span>
        <span class="text-[28px] text-[#0284C7] ui-bold">26%</span>
      </div>
      <div class="card-blush p-5 flex justify-between items-center">
        <span class="text-[24px] text-[#1C1917] ui-title">本月整体</span>
        <span class="text-[32px] text-[#FF7700] ui-bold">22%</span>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-[#1C1917] leading-relaxed"><span class="mark ui-title">原则：</span>低毛利 B 占比从 20% 涨到 40%，利润被<span class="mark">结构</span>拖下来了。销售冲量或高毛利受压，都会出现这种情况。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>03 / 08 · 结构</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
