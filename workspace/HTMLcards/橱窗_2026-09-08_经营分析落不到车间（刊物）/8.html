<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P8：结尾-先拆三件事</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board-cover">
    <div class="relative">
      <div class="wm-num ui-title">08</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">08</div>
        <div>
          <div class="c-en ui-bold" style="color:#6F8A6A">LOCK</div>
          <div class="c-cn">先拆三件</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">先别换设备<br/>也先别买软件</h1>
      <p class="text-[26px] text-[#6B6560] mt-3"><span class="mark">报表好看、工厂看不懂</span>，就先带财务和班长把这三件事拆一遍。</p>
    </div>

    <div class="card-paper p-7 flex items-center gap-5">
      <div class="idx-sq terra ui-bold">01</div>
      <div>
        <div class="text-[22px] text-[#9A938C] ui-bold">NOW</div>
        <div class="text-[32px] text-[#2A2724] ui-title">产品毛利</div>
      </div>
    </div>
    <div class="card-paper p-7 flex items-center gap-5 w-[94%] ml-auto">
      <div class="idx-sq sage ui-bold">02</div>
      <div>
        <div class="text-[22px] text-[#9A938C] ui-bold">CASH</div>
        <div class="text-[32px] text-[#2A2724] ui-title">库存周转</div>
      </div>
    </div>
    <div class="card-paper p-7 flex items-center gap-5 w-[88%] ml-auto">
      <div class="idx-sq ochre ui-bold">03</div>
      <div>
        <div class="text-[22px] text-[#9A938C] ui-bold">FLOW</div>
        <div class="text-[32px] text-[#2A2724] ui-title">瓶颈工序</div>
      </div>
    </div>

    <div class="card-principle px-6 py-6">
      <p class="text-[28px] text-[#2A2724] leading-relaxed"><span class="mark ui-title">原则：</span>制造业老板真正的天花板，不是市场、资本、团队，是他自己<span class="mark">看懂工厂</span>、<span class="mark-sage">算清经营</span>的能力。</p>
    </div>

    <div class="pill-dark px-8 py-6 text-center">
      <div class="text-[24px] text-white/70 ui-bold">点赞 · 收藏 · 转发给</div>
      <div class="text-[30px] text-white ui-title mt-2 leading-snug">还在「报表漂亮、车间糊涂」的厂长</div>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>08 / 08 · 结尾</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
