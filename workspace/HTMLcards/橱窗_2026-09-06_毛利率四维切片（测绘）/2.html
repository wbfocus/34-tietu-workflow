<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2：误区-不全是成本的锅</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">误区</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">02 / 08</span>
</div>
<div class="pl-16 pr-10 mt-7 relative z-10">
  <h1 class="text-[52px] text-[#f3eee4] leading-[1.12] ui-bold">毛利率掉了<br>别先骂采购</h1>
  <p class="text-[28px] text-[#d8d0c4] mt-4 leading-relaxed">利润变动 = 结构变化 + 单品毛利变化 + 折扣策略变化。成本常常只是替罪羊。</p>
</div>
<div class="pl-16 pr-10 mt-8 relative z-10 space-y-4">
  <div class="panel p-6 w-[96%] border-l-[6px] border-l-[#FF7700]">
    <div class="text-[#FF7700] text-[22px] ui-bold mb-2">产品结构下沉</div>
    <p class="text-[28px] text-[#f3eee4] leading-relaxed">为冲销售额猛推低毛利引流款，高毛利护盘产品被挤到角落。</p>
  </div>
  <div class="panel p-6 w-[90%] ml-auto">
    <div class="text-[#0EA5E9] text-[22px] ui-bold mb-2">渠道结构错配</div>
    <p class="text-[28px] text-[#f3eee4] leading-relaxed">增长靠低毛利渠道换回来。某个渠道占比起来，整体毛利被拉低。</p>
  </div>
  <div class="panel p-6 w-[94%]">
    <div class="text-[#d8e0c8] text-[22px] ui-bold mb-2">区域结构偏移</div>
    <p class="text-[28px] text-[#f3eee4] leading-relaxed">资源砸进价格敏感市场，用户只认低价；核心高毛利区域反而缺弹药。</p>
  </div>
</div>
<div class="pl-16 pr-10 mt-6 relative z-10">
  <p class="text-[28px] text-[#e8e0d4] leading-relaxed"><span class="ui-bold text-[#0EA5E9]">第一步不是看成本，</span>而是先把结构切开。</p>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
