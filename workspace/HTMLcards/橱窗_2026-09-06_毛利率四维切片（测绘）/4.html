<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P4：产品-二八结构</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">产品</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">04 / 08</span>
</div>
<div class="pl-16 pr-10 mt-7 relative z-10 flex items-end justify-between gap-6">
  <div>
    <h1 class="text-[48px] text-[#f3eee4] leading-[1.12] ui-bold">先问产品结构<br>是不是太斜</h1>
    <p class="text-[26px] text-[#d8d0c4] mt-4 leading-relaxed w-[560px]">关键不是平均毛利率，而是：20% 的产品贡献了 80% 的毛利，还是反过来。</p>
  </div>
  <div class="axis">
    <div class="line-h"></div><div class="line-v"></div>
    <div class="arm n on ui-bold">产</div>
    <div class="arm e ui-bold">渠</div>
    <div class="arm s ui-bold">区</div>
    <div class="arm w ui-bold">客</div>
    <div class="hub ui-bold">GM</div>
  </div>
</div>
<div class="pl-16 pr-10 mt-8 relative z-10 flex gap-4 items-stretch">
  <div class="panel-hot p-7 w-[38%]">
    <div class="display text-[#FF7700] text-[92px] leading-none">20%</div>
    <div class="text-[#f3eee4] text-[30px] ui-bold mt-3">产品</div>
    <p class="text-[26px] text-[#d8d0c4] mt-3 leading-relaxed">贡献八成毛利。结构高度集中，利润也集中暴露。</p>
  </div>
  <div class="panel p-7 w-[62%]">
    <div class="display text-[#c4bba8] text-[92px] leading-none">80%</div>
    <div class="text-[#f3eee4] text-[30px] ui-bold mt-3">产品</div>
    <p class="text-[26px] text-[#d8d0c4] mt-3 leading-relaxed">若只贡献两成毛利，说明线里有大量低毛利甚至负毛利冗余。</p>
  </div>
</div>
<div class="pl-16 pr-10 mt-6 relative z-10">
  <div class="panel px-7 py-5 border-l-[6px] border-l-[#0EA5E9]">
    <p class="text-[28px] text-[#e8e0d4] leading-relaxed">常态可以是二八，但必须点名：<span class="ui-bold text-[#f3eee4]">那 20% 是哪些 SKU？剩下 80% 在干什么？</span></p>
  </div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
