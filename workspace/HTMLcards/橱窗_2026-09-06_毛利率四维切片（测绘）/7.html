<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P7：四象限贴标签</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">象限</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">07 / 08</span>
</div>
<div class="pl-16 pr-10 mt-6 relative z-10">
  <h1 class="text-[48px] text-[#f3eee4] leading-[1.12] ui-bold">毛利 × 销量<br>给业务贴标签</h1>
</div>
<div class="pl-16 pr-10 mt-5 relative z-10 grid grid-cols-2 gap-4">
  <div class="panel-hot p-6">
    <div class="text-[#FF7700] text-[22px] ui-bold">高毛利 · 高销量</div>
    <div class="text-[34px] text-[#f3eee4] ui-bold mt-2">护盘主力</div>
    <p class="text-[24px] text-[#d8d0c4] mt-2 leading-relaxed">利润基本盘。重点扶持，稳定增长。</p>
  </div>
  <div class="panel p-6">
    <div class="text-[#0EA5E9] text-[22px] ui-bold">高毛利 · 低销量</div>
    <div class="text-[34px] text-[#f3eee4] ui-bold mt-2">潜力业务</div>
    <p class="text-[24px] text-[#d8d0c4] mt-2 leading-relaxed">能赚钱还没跑起来。精准投放，抬出货。</p>
  </div>
  <div class="panel p-6">
    <div class="text-[#c4bba8] text-[22px] ui-bold">低毛利 · 高销量</div>
    <div class="text-[34px] text-[#f3eee4] ui-bold mt-2">冲量业务</div>
    <p class="text-[24px] text-[#d8d0c4] mt-2 leading-relaxed">不是不能卖。控占比、限额，或搭售抬价值。</p>
  </div>
  <div class="panel p-6">
    <div class="text-[#8a8274] text-[22px] ui-bold">低毛利 · 低销量</div>
    <div class="text-[34px] text-[#f3eee4] ui-bold mt-2">低效业务</div>
    <p class="text-[24px] text-[#d8d0c4] mt-2 leading-relaxed">既不赚钱又卖不动。评估清退，别留利润黑洞。</p>
  </div>
</div>
<div class="pl-16 pr-10 mt-5 relative z-10">
  <div class="panel px-7 py-5 border-l-[6px] border-l-[#0EA5E9]">
    <p class="text-[26px] text-[#e8e0d4] leading-relaxed">单品毛利 × 出货量 × 客户类型 = 实际贡献。高毛利但出货极低的 SKU，撑不起盘子；中等毛利稳定出货，才是基本盘。</p>
  </div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
