<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P6：客户结构</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">客户</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">06 / 08</span>
</div>
<div class="pl-16 pr-10 mt-7 relative z-10 flex items-start justify-between gap-4">
  <h1 class="text-[48px] text-[#f3eee4] leading-[1.12] ui-bold">客户多<br>不等于赚钱</h1>
  <div class="axis">
    <div class="line-h"></div><div class="line-v"></div>
    <div class="arm n ui-bold">产</div>
    <div class="arm e ui-bold">渠</div>
    <div class="arm s ui-bold">区</div>
    <div class="arm w on ui-bold">客</div>
    <div class="hub ui-bold">GM</div>
  </div>
</div>
<div class="pl-16 pr-10 mt-8 relative z-10 flex gap-4">
  <div class="panel p-7 w-[58%]">
    <div class="text-[22px] text-[#8a8274] ui-bold mb-2">大客户</div>
    <div class="text-[36px] text-[#f3eee4] ui-bold leading-snug">订单大<br>压价更狠</div>
    <p class="text-[26px] text-[#d8d0c4] mt-4 leading-relaxed">量看起来好看，毛利率可能被条款削薄。依赖某一个低毛利客群，风险和渠道杀手同类。</p>
  </div>
  <div class="panel p-7 w-[42%] mt-8">
    <div class="text-[22px] text-[#0EA5E9] ui-bold mb-2">散客</div>
    <div class="text-[36px] text-[#f3eee4] ui-bold leading-snug">单量小<br>价格韧性</div>
    <p class="text-[26px] text-[#d8d0c4] mt-4 leading-relaxed">价格敏感度未必更高。毛利率往往更厚，是结构里被忽略的垫层。</p>
  </div>
</div>
<div class="pl-16 pr-10 mt-6 relative z-10">
  <div class="panel px-7 py-5 border-l-[6px] border-l-[#FF7700]">
    <p class="text-[28px] text-[#e8e0d4] leading-relaxed"><span class="ui-bold text-[#FF7700]">优化客户结构，比一味追求客户数量更能抬毛利。</span></p>
  </div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
