<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1：封面-四维切片</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">切片</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">01 / 08</span>
</div>
<div class="pl-16 pr-10 mt-8 relative z-10 flex items-start justify-between gap-6">
  <div class="w-[620px]">
    <div class="text-[22px] text-[#0EA5E9] ui-bold tracking-widest uppercase font-mono mb-3">SLICE · 4 AXES</div>
    <h1 class="text-[56px] text-[#f3eee4] leading-[1.12] ui-bold">毛利率该盯的<br>不是总成本</h1>
    <p class="text-[28px] text-[#d8d0c4] mt-4 leading-relaxed">销售涨了 20%，毛利率却掉了。先拆结构，再谈成本。</p>
  </div>
  <div class="text-right">
    <div class="display text-[#FF7700] text-[128px] leading-none">4</div>
    <div class="text-[#c4bba8] text-[24px] ui-bold mt-1">个经营维度</div>
  </div>
</div>
<div class="pl-16 pr-10 mt-8 relative z-10 grid grid-cols-2 gap-4">
  <div class="panel p-6"><div class="text-[#0EA5E9] text-[22px] ui-bold mb-1">01 产品</div><div class="text-[#f3eee4] text-[30px] ui-bold">护盘款被边缘化</div></div>
  <div class="panel p-6 ml-4"><div class="text-[#0EA5E9] text-[22px] ui-bold mb-1">02 渠道</div><div class="text-[#f3eee4] text-[30px] ui-bold">低毛利渠道换量</div></div>
  <div class="panel p-6 w-[92%]"><div class="text-[#0EA5E9] text-[22px] ui-bold mb-1">03 区域</div><div class="text-[#f3eee4] text-[30px] ui-bold">价格敏感市场吸血</div></div>
  <div class="panel-hot p-6"><div class="text-[#FF7700] text-[22px] ui-bold mb-1">04 客户</div><div class="text-[#f3eee4] text-[30px] ui-bold">大客户压价伤盘</div></div>
</div>
<div class="pl-16 pr-10 mt-6 relative z-10">
  <div class="panel px-7 py-5 border-l-[6px] border-l-[#0EA5E9]">
    <p class="text-[28px] text-[#e8e0d4] leading-relaxed"><span class="text-[#0EA5E9] ui-bold">老汪洞察：</span>毛利率不是静态数字，是定价、成本、产品力和客户结构的综合结果。</p>
  </div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
