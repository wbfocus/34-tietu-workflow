<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P3：方法-三笔账</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">三账</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">03 / 08</span>
</div>
<div class="pl-16 pr-10 mt-7 relative z-10">
  <h1 class="text-[52px] text-[#f3eee4] leading-[1.12] ui-bold">用三笔账<br>把黑盒子拆开</h1>
  <p class="text-[26px] text-[#d8d0c4] mt-3 leading-relaxed">毛利率下降 = 结构偏移的账 + 单品毛利的账 + 折扣策略的账。三数相加应等于总降幅。</p>
</div>
<div class="pl-16 pr-10 mt-7 relative z-10 space-y-4">
  <div class="panel p-6 flex gap-5 items-start">
    <div class="w-16 h-16 rounded-lg bg-[#0EA5E9] text-[#1c1a14] text-[28px] ui-bold flex items-center justify-center flex-shrink-0">01</div>
    <div>
      <div class="text-[#f3eee4] text-[32px] ui-bold">结构偏移</div>
      <p class="text-[26px] text-[#d8d0c4] mt-2 leading-relaxed">高毛利卖少了、低毛利卖多了。占比变化 × 上年毛利率。从这里算起，往往最大。</p>
    </div>
  </div>
  <div class="panel p-6 flex gap-5 items-start w-[94%] ml-auto">
    <div class="w-16 h-16 rounded-lg border border-[#8a7a4a] text-[#e8e0d0] text-[28px] ui-bold flex items-center justify-center flex-shrink-0">02</div>
    <div>
      <div class="text-[#f3eee4] text-[32px] ui-bold">单品毛利变动</div>
      <p class="text-[26px] text-[#d8d0c4] mt-2 leading-relaxed">原料涨价或主动降价。单品毛利率变化 × 今年销售占比。</p>
    </div>
  </div>
  <div class="panel p-6 flex gap-5 items-start">
    <div class="w-16 h-16 rounded-lg border border-[#8a7a4a] text-[#e8e0d0] text-[28px] ui-bold flex items-center justify-center flex-shrink-0">03</div>
    <div>
      <div class="text-[#f3eee4] text-[32px] ui-bold">折扣策略波动</div>
      <p class="text-[26px] text-[#d8d0c4] mt-2 leading-relaxed">促销、满减、返利都是变相降价。对比实际毛利率与标价毛利率。</p>
    </div>
  </div>
</div>
<div class="pl-16 pr-10 mt-6 relative z-10">
  <p class="text-[28px] text-[#e8e0d4] leading-relaxed"><span class="ui-bold text-[#FF7700]">哪个数字最大，就先解决哪个。</span></p>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
