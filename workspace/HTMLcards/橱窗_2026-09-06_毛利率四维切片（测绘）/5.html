<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P5：渠道与区域</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">渠道</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">05 / 08</span>
</div>
<div class="pl-16 pr-10 mt-7 relative z-10 flex items-start justify-between">
  <h1 class="text-[48px] text-[#f3eee4] leading-[1.12] ui-bold">同货不同毛利<br>差在哪卖</h1>
  <div class="axis mt-1">
    <div class="line-h"></div><div class="line-v"></div>
    <div class="arm n ui-bold">产</div>
    <div class="arm e on ui-bold">渠</div>
    <div class="arm s on ui-bold">区</div>
    <div class="arm w ui-bold">客</div>
    <div class="hub ui-bold">GM</div>
  </div>
</div>
<div class="pl-16 pr-10 mt-7 relative z-10">
  <div class="panel p-7">
    <div class="text-[#0EA5E9] text-[22px] ui-bold mb-2">拆渠道</div>
    <p class="text-[30px] text-[#f3eee4] ui-bold leading-relaxed">同一件商品，不同渠道毛利率可能差 15% 以上。</p>
    <p class="text-[26px] text-[#d8d0c4] mt-3 leading-relaxed">目的不是看谁卖得多，而是标出毛利杀手和利润贡献者。过度依赖某个低毛利渠道，增长就是在换血。</p>
  </div>
  <div class="panel p-7 mt-4 w-[94%] ml-auto">
    <div class="text-[#0EA5E9] text-[22px] ui-bold mb-2">拆区域</div>
    <p class="text-[30px] text-[#f3eee4] ui-bold leading-relaxed">整体毛利往下掉，问题可能只来自个别市场。</p>
    <p class="text-[26px] text-[#d8d0c4] mt-3 leading-relaxed">消费力、竞争、物流成本都会改毛利。先锁定异常区域，再决定要不要继续砸资源。</p>
  </div>
</div>
<div class="pl-16 pr-10 mt-5 relative z-10">
  <p class="text-[26px] text-[#e8e0d4] leading-relaxed">季节波动也要单列：别把淡季当成结构恶化。</p>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
