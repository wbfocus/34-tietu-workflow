<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P8：动作-结构决定利润</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link rel="stylesheet" href="theme-survey.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] canvas relative overflow-hidden box-border wenkai pt-9 pb-20">
<div class="mark mark-tl"></div><div class="mark mark-tr"></div><div class="mark mark-bl"></div><div class="mark mark-br"></div>
<div class="spine ui-bold text-[22px]">动作</div>
<div class="flex justify-between items-center pl-16 pr-10 relative z-10">
  <span class="chip px-6 py-2 text-[22px] text-[#d8e0c8] ui-bold">老汪洞察 · 毛利测绘</span>
  <span class="text-[#8a8274] text-[26px] ui-bold">08 / 08</span>
</div>
<div class="pl-16 pr-10 mt-6 relative z-10">
  <h1 class="text-[48px] text-[#f3eee4] leading-[1.12] ui-bold">四刀切完<br>就动手</h1>
</div>
<div class="pl-16 pr-10 mt-5 relative z-10 space-y-3">
  <div class="panel p-5 flex gap-4 items-center">
    <div class="w-14 h-14 rounded-lg bg-[#0EA5E9] text-[#1c1a14] text-[24px] ui-bold flex items-center justify-center flex-shrink-0">01</div>
    <p class="text-[26px] text-[#f3eee4] leading-relaxed"><span class="ui-bold">产品组合：</span>护盘款聚焦，冲量款控占比，潜力款精准投放。</p>
  </div>
  <div class="panel p-5 flex gap-4 items-center w-[94%] ml-auto">
    <div class="w-14 h-14 rounded-lg border border-[#8a7a4a] text-[#e8e0d0] text-[24px] ui-bold flex items-center justify-center flex-shrink-0">02</div>
    <p class="text-[26px] text-[#f3eee4] leading-relaxed"><span class="ui-bold">定价：</span>按成本 + 客户期望建目标毛利区间；提不了价就改成本或捆绑。</p>
  </div>
  <div class="panel p-5 flex gap-4 items-center">
    <div class="w-14 h-14 rounded-lg border border-[#8a7a4a] text-[#e8e0d0] text-[24px] ui-bold flex items-center justify-center flex-shrink-0">03</div>
    <p class="text-[26px] text-[#f3eee4] leading-relaxed"><span class="ui-bold">激励：</span>高毛利提成更高。让销售推赚钱的，而不是好卖的。</p>
  </div>
  <div class="panel p-5 flex gap-4 items-center w-[94%] ml-auto">
    <div class="w-14 h-14 rounded-lg border border-[#8a7a4a] text-[#e8e0d0] text-[24px] ui-bold flex items-center justify-center flex-shrink-0">04</div>
    <p class="text-[26px] text-[#f3eee4] leading-relaxed"><span class="ui-bold">渠道：</span>按毛利贡献配资源。负毛利渠道可以淘汰。</p>
  </div>
</div>
<div class="pl-16 pr-10 mt-5 relative z-10">
  <div class="panel px-7 py-5 border-l-[6px] border-l-[#FF7700]">
    <p class="text-[26px] text-[#e8e0d4] leading-relaxed"><span class="ui-bold text-[#FF7700]">销售额是表象，结构决定能赚多少。</span>毛利分析的本质是做减法：砍低效，把资源集中到真正创造利润的地方。</p>
  </div>
</div>
<div class="absolute bottom-6 left-0 w-full text-center text-[#6b6458] text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
