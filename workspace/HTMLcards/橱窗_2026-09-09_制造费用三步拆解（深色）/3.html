<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3：先归集</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">03</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">03</div>
        <div>
          <div class="c-en ui-bold">IN</div>
          <div class="c-cn">先归集</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">先搞清楚收的是什么<br/>归集错了后面全白搭</h1>
      <p class="text-[26px] text-slate-300 mt-3">制造费用只收车间为生产发生的间接费用，不是什么都能塞进来。</p>
    </div>
    <div class="tier">
      <div class="tier-lab terra ui-bold">该收</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-slate-400 ui-bold">车间间接</div>
        <div class="text-[26px] text-white ui-title leading-snug">折旧、水电蒸汽、机物料、车间管理人员工资</div>
      </div>
    </div>
    <div class="tier" style="width:96%">
      <div class="tier-lab sage ui-bold">修理费</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-slate-400 ui-bold">按受益对象</div>
        <div class="text-[26px] text-white ui-title leading-snug">跟存货生产相关的日常修理，可以进制造费用</div>
      </div>
    </div>
    <div class="tier" style="width:92%">
      <div class="tier-lab ochre ui-bold">别塞</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-slate-400 ui-bold">容易混岗</div>
        <div class="text-[26px] text-white ui-title leading-snug">办公室修理进管理费用，大改资本化，销售费用另走</div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>大额更新改造拆成几张小发票、分月进制造费用，就是把该资本化的<span class="mark">费用化</span>了。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>03 / 08 · 归集</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
