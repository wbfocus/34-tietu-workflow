<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P5：边上蹲着的人</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">05</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">05</div>
        <div>
          <div class="c-en ui-bold">PEOPLE</div>
          <div class="c-cn">边上蹲着的人</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">边上蹲着的人<br/>不是同一个 BP</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">听到「BP」，先问：<span class="mark">财务、人事，还是业务自己的人</span>。</p>
    </div>

    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">1</div>
      <div>
        <div class="text-[20px] text-[#9A938C] ui-bold">FBP</div>
        <div class="text-[28px] text-[#2A2724] ui-title">财经业务伙伴 · 跟着业务算赚不赚</div>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n sage ui-bold">2</div>
      <div>
        <div class="text-[20px] text-[#9A938C] ui-bold">HRBP</div>
        <div class="text-[28px] text-[#2A2724] ui-title">人事业务伙伴 · 不是同一个岗位</div>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n ochre ui-bold">3</div>
      <div>
        <div class="text-[20px] text-[#9A938C] ui-bold">盯客户的人</div>
        <div class="text-[28px] text-[#2A2724] ui-title">有人叫 AR · 先别当成应收账款</div>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">4</div>
      <div>
        <div class="text-[20px] text-[#9A938C] ui-bold">盯方案 · 盯交付</div>
        <div class="text-[28px] text-[#2A2724] ui-title">三个人盯一单，不是财务部编制</div>
      </div>
    </div>

    <div class="card-blush px-6 py-5">
      <p class="text-[26px] text-[#2A2724] leading-relaxed">听到 <span class="mark ui-title">AR</span>，先问一句：你说的是<span class="mark">盯客户的人</span>，还是<span class="mark-sage">客户欠的钱</span>？</p>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>05 / 12 · 人</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
