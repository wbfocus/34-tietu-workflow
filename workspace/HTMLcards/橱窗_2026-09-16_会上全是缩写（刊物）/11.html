<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>

<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">11</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">11</div>
        <div>
          <div class="c-en ui-bold">BOARD</div>
          <div class="c-cn">谁能拍板</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">这些是会<br/>不是多一个部门</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">软件名也一样：<span class="mark">记账的底，不是管理办法</span>。</p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">EMT</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">经营管理团队</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">大事谁拍板</p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">产品委员会</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">做什么产品</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">上不上、砍不砍</p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">供应链委员会</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">货怎么供</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">产能、库存、交期</p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">投资评审</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">钱砸不砸</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">设备、产线、项目</p>
      </div>
    </div>

    <div class="hl-bar px-6 py-5">
      <p class="text-[26px] text-[#2A2724] leading-relaxed">ERP、PLM、MES 是<span class="mark-sage">记账的底</span>。大屏亮了，不代表已经管住。</p>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>11 / 12 · 拍板</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
