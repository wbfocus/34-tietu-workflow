<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6：一单变成钱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">06</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">06</div>
        <div>
          <div class="c-en ui-bold" style="color:#6F8A6A">CASH</div>
          <div class="c-cn">一单变成钱</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">一单从线索<br/>到钱进账</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">有人把这叫 LTC。人话就是：<span class="mark">单有了，钱进账了没有</span>。</p>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div class="card-paper p-5 text-center">
        <div class="text-[22px] text-[#D16C4F] ui-bold">01</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-2">线索</div>
        <p class="text-[22px] text-[#6B6560] mt-1">有没有苗头</p>
      </div>
      <div class="card-paper p-5 text-center">
        <div class="text-[22px] text-[#D16C4F] ui-bold">02</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-2">机会点</div>
        <p class="text-[22px] text-[#6B6560] mt-1">能不能做成单</p>
      </div>
      <div class="card-paper p-5 text-center">
        <div class="text-[22px] text-[#D16C4F] ui-bold">03</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-2">合同</div>
        <p class="text-[22px] text-[#6B6560] mt-1">条款签下来</p>
      </div>
      <div class="card-paper p-5 text-center">
        <div class="text-[22px] text-[#6F8A6A] ui-bold">04</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-2">发货验收</div>
        <p class="text-[22px] text-[#6B6560] mt-1">货交到对方</p>
      </div>
      <div class="card-paper p-5 text-center">
        <div class="text-[22px] text-[#6F8A6A] ui-bold">05</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-2">开票</div>
        <p class="text-[22px] text-[#6B6560] mt-1">账上能认收入</p>
      </div>
      <div class="card-sage p-5 text-center">
        <div class="text-[22px] text-[#6F8A6A] ui-bold">06</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-2">回款</div>
        <p class="text-[22px] text-[#6B6560] mt-1">钱真正进账</p>
      </div>
    </div>

    <div class="card-callout px-6 py-5">
      <p class="text-[26px] text-[#2A2724] leading-relaxed">一单还要算四遍：<span class="mark">先估、再编、做的时候算、收口再算</span>。采购订单和销售订单，别叫成同一个 PO。</p>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>06 / 12 · 一单</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
