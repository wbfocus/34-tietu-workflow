<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P8：编预算做考核</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">08</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">08</div>
        <div>
          <div class="c-en ui-bold" style="color:#6F8A6A">PLAN</div>
          <div class="c-cn">编预算做考核</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">编预算、做考核<br/>会听到这些</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">一张表对人，一张表对钱。<span class="mark">别听成同一张</span>。</p>
    </div>

    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">1</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">年度要打的数</div>
        <p class="text-[24px] text-[#6B6560] mt-1">今年卖多少、花多少、赚多少</p>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n sage ui-bold">2</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">每个月滚着看</div>
        <p class="text-[24px] text-[#6B6560] mt-1">已经发生的，加上后面还怎么走</p>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n ochre ui-bold">3</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">对人那张承诺表</div>
        <p class="text-[24px] text-[#6B6560] mt-1">有人叫 PBC。不是利润表，是你答应干成啥</p>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">4</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">预算编到哪一层就停</div>
        <p class="text-[24px] text-[#6B6560] mt-1">最小预算单元。不到岗位，先别往下拆</p>
      </div>
    </div>

    <div class="card-callout px-6 py-5">
      <p class="text-[26px] text-[#2A2724] leading-relaxed">KPI 是盯哪几个数。PBC 是<span class="mark-sage">这个人答应做成啥</span>。两个词一起蹦，先分开听。</p>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>08 / 12 · 预算</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
