<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P9：下车间</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">09</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">09</div>
        <div>
          <div class="c-en ui-bold">SHOP</div>
          <div class="c-cn">下车间</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">下车间<br/>这些词最常蹦</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">财务跟着走现场，先听懂<span class="mark">货在哪、料怎么配</span>。</p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">PMC</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">计划物控</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">料和产谁来排，缺料卡在哪</p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">S&amp;OP</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">产销平衡</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">卖的和做的对上没有</p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">BOM</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">用料结构</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">这颗料怎么配，不是物料编码</p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[20px] text-[#9A938C] ui-bold">WIP</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">在制品</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">货还在线上，钱已经压住了</p>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div class="card-blush p-5 text-center">
        <div class="text-[26px] text-[#2A2724] ui-title">供方质量</div>
        <p class="text-[22px] text-[#6B6560] mt-2">来料行不行</p>
      </div>
      <div class="card-blush p-5 text-center">
        <div class="text-[26px] text-[#2A2724] ui-title">设计质量</div>
        <p class="text-[22px] text-[#6B6560] mt-2">图纸有没有坑</p>
      </div>
      <div class="card-blush p-5 text-center">
        <div class="text-[26px] text-[#2A2724] ui-title">安环</div>
        <p class="text-[22px] text-[#6B6560] mt-2">现场能不能干</p>
      </div>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>09 / 12 · 现场</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
