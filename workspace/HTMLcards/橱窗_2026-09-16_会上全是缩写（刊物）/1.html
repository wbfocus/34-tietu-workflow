<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1：会上全是缩写</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board-cover">
    <div class="relative">
      <div class="wm-num ui-title">01</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">01</div>
        <div>
          <div class="c-en ui-bold">HEAR</div>
          <div class="c-cn">会上听缩写</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[54px] text-[#2A2724] leading-[1.12] ui-title">会上全是缩写<br/>你<span class="text-[#D16C4F]">听懂几句</span>？</h1>
      <p class="text-[28px] text-[#6B6560] mt-4 leading-relaxed">财务、销售、计划各说各的。听不懂，<span class="mark">先别装懂</span>。</p>
    </div>

    <div class="pill-dark px-8 py-5 flex items-center gap-4">
      <span class="bg-[#D16C4F] text-white text-[22px] ui-bold px-4 py-1.5 rounded-full">先问</span>
      <span class="text-[26px] wenkai leading-snug">这缩写是人、组织、流程，还是在说钱</span>
    </div>

    <div class="flex items-center gap-8">
      <div class="hero-orb ui-title text-[92px] leading-none">6</div>
      <div>
        <div class="text-[32px] text-[#2A2724] ui-title leading-tight">先分成六类<br/>再往下听</div>
        <p class="text-[26px] text-[#6B6560] mt-3 leading-relaxed">不用一次背完。会上一蹦出来，<span class="mark-sage">对上号</span>就行。</p>
      </div>
    </div>

    <div class="flex flex-wrap gap-3">
      <span class="card-paper px-5 py-3 text-[22px] ui-bold text-[#2A2724]">组织</span>
      <span class="card-paper px-5 py-3 text-[22px] ui-bold text-[#2A2724]">人</span>
      <span class="card-paper px-5 py-3 text-[22px] ui-bold text-[#2A2724]">流程</span>
      <span class="card-paper px-5 py-3 text-[22px] ui-bold text-[#2A2724]">一单</span>
      <span class="card-paper px-5 py-3 text-[22px] ui-bold text-[#2A2724]">利润</span>
      <span class="card-paper px-5 py-3 text-[22px] ui-bold text-[#2A2724]">现场</span>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>01 / 12 · 封面</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
