<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P7：哪口利润</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">07</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">07</div>
        <div>
          <div class="c-en ui-bold">PROFIT</div>
          <div class="c-cn">哪口利润</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">他们说的利润<br/>可能不是一回事</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">别急着点头。先问：<span class="mark">扣到哪一层了</span>。</p>
    </div>

    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">1</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">毛利</div>
        <p class="text-[24px] text-[#6B6560] mt-1">卖价减去把货做出来的成本</p>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n sage ui-bold">2</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">贡献边际</div>
        <p class="text-[24px] text-[#6B6560] mt-1">只扣会跟着产量变的那些</p>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n ochre ui-bold">3</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">营业利润</div>
        <p class="text-[24px] text-[#6B6560] mt-1">再扣管销这些期间费用</p>
      </div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">4</div>
      <div>
        <div class="text-[28px] text-[#2A2724] ui-title">净利润</div>
        <p class="text-[24px] text-[#6B6560] mt-1">税也扣完了，账上剩的</p>
      </div>
    </div>
    <div class="hl-bar px-6 py-5">
      <p class="text-[26px] text-[#2A2724] leading-relaxed">还有一口叫 EVA：<span class="mark">占用的钱也算成本</span>。扣完这个，才叫真正赚。</p>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>07 / 12 · 利润</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
