<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3：就六条线</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">03</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">03</div>
        <div>
          <div class="c-en ui-bold">FLOW</div>
          <div class="c-cn">就六条线</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">华为那套<br/>其实就六条线</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">英文只是番号。人话就一句：<span class="mark">事走到哪了</span>。</p>
    </div>

    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">1</div>
      <div class="flex-none w-[88px] text-[18px] text-[#9A938C] ui-bold tracking-widest">DSTE</div>
      <div class="text-[28px] text-[#2A2724] ui-title">今年要打哪，预算从哪来</div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n sage ui-bold">2</div>
      <div class="flex-none w-[88px] text-[18px] text-[#9A938C] ui-bold tracking-widest">IPD</div>
      <div class="text-[28px] text-[#2A2724] ui-title">想法怎么变成可卖的货</div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n ochre ui-bold">3</div>
      <div class="flex-none w-[88px] text-[18px] text-[#9A938C] ui-bold tracking-widest">ISC</div>
      <div class="text-[28px] text-[#2A2724] ui-title">货怎么走：计划到交付</div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n terra ui-bold">4</div>
      <div class="flex-none w-[88px] text-[18px] text-[#9A938C] ui-bold tracking-widest">LTC</div>
      <div class="text-[28px] text-[#2A2724] ui-title">单怎么变成钱：一直到回款</div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n sage ui-bold">5</div>
      <div class="flex-none w-[88px] text-[18px] text-[#9A938C] ui-bold tracking-widest">ITR</div>
      <div class="text-[28px] text-[#2A2724] ui-title">出事怎么收：客诉、质量、变更</div>
    </div>
    <div class="card-paper px-6 py-5 flex items-center gap-5">
      <div class="dot-n ochre ui-bold">6</div>
      <div class="flex-none w-[88px] text-[18px] text-[#9A938C] ui-bold tracking-widest">IFS</div>
      <div class="text-[28px] text-[#2A2724] ui-title">钱怎么算到人、算到这个月</div>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>03 / 12 · 六条线</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
