<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2：先分成六类</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">02</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">02</div>
        <div>
          <div class="c-en ui-bold" style="color:#6F8A6A">SORT</div>
          <div class="c-cn">先分成六类</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">听不懂就先分类<br/>别急着记单词</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">缩写本身不重要。重要的是：<span class="mark">他在问哪一件事</span>。</p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="card-paper p-6">
        <div class="text-[22px] text-[#9A938C] ui-bold">01</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">组织</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">账挂在<span class="mark">谁头上</span></p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[22px] text-[#9A938C] ui-bold">02</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">人</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">谁盯着<span class="mark-sage">这摊事</span></p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[22px] text-[#9A938C] ui-bold">03</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">流程</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">这笔业务<span class="mark">走到哪</span></p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[22px] text-[#9A938C] ui-bold">04</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">一单</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">合同到底<span class="mark-sage">赚不赚</span></p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[22px] text-[#9A938C] ui-bold">05</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">利润</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">算的是<span class="mark">哪一口</span></p>
      </div>
      <div class="card-paper p-6">
        <div class="text-[22px] text-[#9A938C] ui-bold">06</div>
        <div class="text-[30px] text-[#2A2724] ui-title mt-1">现场</div>
        <p class="text-[24px] text-[#6B6560] mt-2 leading-relaxed">货和计划在<span class="mark-ochre">说什么</span></p>
      </div>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>02 / 12 · 分类</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
