<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P4：账挂谁头上</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-c.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#FDF8F2] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">04</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">04</div>
        <div>
          <div class="c-en ui-bold" style="color:#6F8A6A">ORG</div>
          <div class="c-cn">账挂谁头上</div>
        </div>
      </div>
    </div>

    <div>
      <h1 class="text-[50px] text-[#2A2724] leading-[1.12] ui-title">账挂在谁头上<br/>别叫成一个部门</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">集团、单元，常常只是<span class="mark">番号</span>，不是多挂一块牌子。</p>
    </div>

    <div class="tier">
      <div class="tier-lab terra ui-bold">前台卖</div>
      <div class="px-6 py-5">
        <div class="text-[20px] text-[#9A938C] ui-bold">CBG · 客户那一摊</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">对着客户的人，填销售目标的最小一摊</div>
      </div>
    </div>
    <div class="tier" style="width:96%">
      <div class="tier-lab sage ui-bold">做产品</div>
      <div class="px-6 py-5">
        <div class="text-[20px] text-[#9A938C] ui-bold">PBG · 产品线</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">中台把货做出来，不是销售部的别名</div>
      </div>
    </div>
    <div class="tier" style="width:92%">
      <div class="tier-lab ochre ui-bold">后台供</div>
      <div class="px-6 py-5">
        <div class="text-[20px] text-[#9A938C] ui-bold">ISC · 供应链</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">计划、采购、制造、出货，整条链</div>
      </div>
    </div>
    <div class="tier" style="width:88%">
      <div class="tier-lab terra ui-bold">再往下</div>
      <div class="px-6 py-5">
        <div class="text-[20px] text-[#9A938C] ui-bold">代表处 · 最小预算单元</div>
        <div class="text-[28px] text-[#2A2724] ui-title mt-1">前线作战单元；预算编到哪一层就停</div>
      </div>
    </div>

    <div class="hl-bar px-6 py-5">
      <p class="text-[26px] text-[#2A2724] leading-relaxed">会上说 BG、BU，先问：<span class="mark">账算到哪一层</span>，别把三个番号听成一个科室。</p>
    </div>

    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>04 / 12 · 组织</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#2A2724]/35 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
