<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P4：三个维度与分母</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">04</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">04</div>
        <div>
          <div class="c-en sage ui-bold">SLICE</div>
          <div class="c-cn">三个维度</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-[#1C1917] leading-[1.12] ui-title">利润到底是被谁拉低的<br/>三个结构一起拉</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">只看一个总数，容易把锅全甩给成本。</p>
    </div>
    <div class="tier">
      <div class="tier-lab terra ui-bold">产品结构</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-[#9A938C] ui-bold">谁高谁低</div>
        <div class="text-[26px] text-[#1C1917] ui-title leading-snug">哪些产品毛利率高、哪些低，占比怎么变</div>
      </div>
    </div>
    <div class="tier" style="width:96%">
      <div class="tier-lab sage ui-bold">客户结构</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-[#9A938C] ui-bold">谁在拖后腿</div>
        <div class="text-[26px] text-[#1C1917] ui-title leading-snug">大客户毛利率 25% 占比在降，散户 8% 占比在涨</div>
      </div>
    </div>
    <div class="tier" style="width:92%">
      <div class="tier-lab ochre ui-bold">渠道结构</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-[#9A938C] ui-bold">哪条路更亏</div>
        <div class="text-[26px] text-[#1C1917] ui-title leading-snug">直营 35%、经销 15%，经销占比一涨整体就往下走</div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-[#1C1917] leading-relaxed"><span class="mark ui-title">原则：</span>分母别拿回款额乱套。化妆品公司按标准零售价重算，再扣进场费堆头费，往往是<span class="mark-sage">小店</span>赚钱效率更高，不是大卖场。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>04 / 08 · 维度</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
