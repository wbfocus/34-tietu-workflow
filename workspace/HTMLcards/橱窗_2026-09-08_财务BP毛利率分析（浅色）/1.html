<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1：封面-毛利率三层</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute inset-0 mesh pointer-events-none z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board-cover">
    <div class="relative">
      <div class="wm-num ui-title">01</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">01</div>
        <div>
          <div class="c-en ui-bold">LAYER</div>
          <div class="c-cn">毛利率分析</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[52px] text-[#1C1917] leading-[1.12] ui-title">毛利率分完了<br/>你还能往哪走？</h1>
      <p class="text-[28px] text-[#6B6560] mt-4 leading-relaxed">财务伙伴算出降了几个点，业务一眼扫过：这些话<span class="mark">我自己也会说</span>。</p>
    </div>
    <div class="pill-dark px-8 py-5 flex items-center gap-4">
      <span class="bg-[#FF7700] text-white text-[22px] ui-bold px-4 py-1.5 rounded-full">判断</span>
      <span class="text-[26px] wenkai leading-snug">说得对，但没用。他要的是<span class="mark">下一步干什么</span></span>
    </div>
    <div class="flex items-center gap-8">
      <div class="hero-orb ui-title text-[92px] leading-none">3</div>
      <div>
        <div class="text-[32px] text-[#1C1917] ui-title leading-tight">三层链路<br/>从数字追到动作</div>
        <p class="text-[26px] text-[#6B6560] mt-3 leading-relaxed">分析 → 根因 → <span class="mark-sage">能执行的动作</span></p>
      </div>
    </div>
    <div class="flex flex-wrap gap-3">
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#1C1917] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#0EA5E9]"></span>结构分析</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#1C1917] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#0EA5E9]"></span>根因定位</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-[#1C1917] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#FF7700]"></span>给到动作</span>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>01 / 08 · 封面</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
