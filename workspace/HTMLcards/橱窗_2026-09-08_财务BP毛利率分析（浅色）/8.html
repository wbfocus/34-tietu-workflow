<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P8：三层收口</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute inset-0 mesh pointer-events-none z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board-cover">
    <div class="relative">
      <div class="wm-num ui-title">08</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">08</div>
        <div>
          <div class="c-en sage ui-bold">LOCK</div>
          <div class="c-cn">给到动作</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-[#1C1917] leading-[1.12] ui-title">从「是什么」走到<br/>「怎么办」</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">大部分人停在数字，一部分走到原因，能走到动作的，业务<span class="mark">离不开他</span>。</p>
    </div>
    <div class="card-paper p-6 flex items-center gap-5">
      <div class="idx-sq terra ui-bold">01</div>
      <div>
        <div class="text-[22px] text-[#9A938C] ui-bold">分析</div>
        <div class="text-[30px] text-[#1C1917] ui-title">分对方向，别只查成本</div>
      </div>
    </div>
    <div class="card-paper p-6 flex items-center gap-5 w-[94%] ml-auto">
      <div class="idx-sq sage ui-bold">02</div>
      <div>
        <div class="text-[22px] text-[#9A938C] ui-bold">根因</div>
        <div class="text-[30px] text-[#1C1917] ui-title">主动被动，一次还是趋势</div>
      </div>
    </div>
    <div class="card-paper p-6 flex items-center gap-5 w-[88%] ml-auto">
      <div class="idx-sq ochre ui-bold">03</div>
      <div>
        <div class="text-[22px] text-[#9A938C] ui-bold">落地</div>
        <div class="text-[30px] text-[#1C1917] ui-title">动作、量化、排优先级</div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-[#1C1917] leading-relaxed"><span class="mark ui-title">原则：</span>分错方向白干，不追根因空谈，不给动作白说。给业务的不再是数字，是动作。</p>
    </div>
    <div class="pill-dark px-8 py-6 text-center">
      <div class="text-[24px] text-white/70 ui-bold">点赞 · 收藏 · 转发给</div>
      <div class="text-[30px] text-white ui-title mt-2 leading-snug">还在写「建议关注」的同事</div>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>08 / 08 · 收口</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
