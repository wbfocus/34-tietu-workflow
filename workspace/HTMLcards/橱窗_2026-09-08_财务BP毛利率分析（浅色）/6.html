<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6：同样降四个点</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">06</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">06</div>
        <div>
          <div class="c-en sage ui-bold">FORK</div>
          <div class="c-cn">两条路径</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-[#1C1917] leading-[1.12] ui-title">同样降了 4 个点<br/>建议方向完全不同</h1>
      <p class="text-[26px] text-[#6B6560] mt-3">A 占比 80%→60%，B 占比 20%→40%。结构结论一样，根因不一样。</p>
    </div>
    <div class="card-paper p-6">
      <div class="flex items-center gap-4">
        <span class="x-mark ui-bold">被</span>
        <div class="text-[28px] text-[#1C1917] ui-title">被动恶化</div>
      </div>
      <p class="text-[24px] text-[#6B6560] mt-3 leading-relaxed">A 被竞品挤压，B 靠降价促销撑住总收入。这是趋势性风险：要<span class="mark">救 A</span>，或调整 B 的定价少流血。</p>
    </div>
    <div class="card-paper p-6">
      <div class="flex items-center gap-4">
        <span class="ok-mark ui-bold">主</span>
        <div class="text-[28px] text-[#1C1917] ui-title">主动战略</div>
      </div>
      <p class="text-[24px] text-[#6B6560] mt-3 leading-relaxed">公司用 B 打低价抢市场，A 策略性收缩。这时不该只喊把毛利率拉回来，而要评估 B 能不能变成<span class="mark-sage">规模效应</span>。</p>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-[#1C1917] leading-relaxed"><span class="mark ui-title">原则：</span>一个要救 A，一个要评估 B 的战略进展。根因定位不同，给业务的动作就不同。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>06 / 08 · 分叉</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
