<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3：零售商公式</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">03</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">03</div>
        <div>
          <div class="c-en ui-bold">SHELF</div>
          <div class="c-cn">零售商</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">零售商一条公式<br/>从货架倒推卖掉多少</h1>
      <p class="text-[26px] text-slate-300 mt-3">只买进再卖出，不生产，成本计算相对直接。</p>
    </div>
    <div class="hl-bar px-6 py-5">
      <div class="text-[22px] text-slate-400 ui-bold">零售销货成本</div>
      <div class="text-[28px] text-white ui-title mt-1">期初存货 ＋ 本期购货 ＋ 购货运费 － 期末存货</div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-slate-200">期初存货</span>
        <span class="text-[28px] text-white ui-bold">10,000</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-slate-200">本期购货</span>
        <span class="text-[28px] text-white ui-bold">14,000</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-slate-200">购货运费</span>
        <span class="text-[28px] text-white ui-bold">1,000</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-slate-200">可供销售</span>
        <span class="text-[28px] text-[#0EA5E9] ui-bold">25,000</span>
      </div>
      <div class="card-paper p-5 flex justify-between items-center">
        <span class="text-[24px] text-slate-200">减：期末存货</span>
        <span class="text-[28px] text-white ui-bold">5,000</span>
      </div>
      <div class="card-blush p-5 flex justify-between items-center">
        <span class="text-[24px] text-white ui-title">销货成本</span>
        <span class="text-[32px] text-[#FF7700] ui-bold">20,000</span>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>25,000 是本期<span class="mark-sage">最多可能卖掉</span>的成本。货架上还剩 5,000，剩下的 20,000 才是已经售出的。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>03 / 08 · 零售</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
