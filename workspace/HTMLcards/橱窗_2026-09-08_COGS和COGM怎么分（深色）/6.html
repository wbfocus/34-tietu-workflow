<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6：流进利润表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">06</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">06</div>
        <div>
          <div class="c-en sage ui-bold">PANDL</div>
          <div class="c-cn">进利润表</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">产品售出后<br/>成本才与收入相遇</h1>
      <p class="text-[26px] text-slate-300 mt-3">制造成本发生后不会立刻全部进利润表，先跟随<span class="mark-sage">存货</span>流转。</p>
    </div>
    <div class="hl-bar px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed">完成时进入产成品。售出后才进入<span class="mark">销货成本</span>。</p>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="card-paper p-7">
        <div class="text-[22px] text-slate-400 ui-bold">收入减成本</div>
        <div class="text-[30px] text-white ui-title mt-2">毛利</div>
        <p class="text-[24px] text-slate-300 mt-2 leading-relaxed">销售收入 － <span class="mark">销货成本</span></p>
      </div>
      <div class="card-paper p-7">
        <div class="text-[22px] text-slate-400 ui-bold">毛利占收入</div>
        <div class="text-[30px] text-white ui-title mt-2">毛利率</div>
        <p class="text-[24px] text-slate-300 mt-2 leading-relaxed">毛利 ÷ 销售收入 × 100%</p>
      </div>
    </div>
    <div class="card-blush p-7 flex items-center justify-between gap-6">
      <div>
        <div class="text-[24px] text-slate-300">若销货成本占收入 75%</div>
        <div class="text-[32px] text-white ui-title mt-2">毛利率就是 25%</div>
      </div>
      <div class="text-right">
        <div class="text-[52px] text-[#FF7700] ui-bold leading-none">0.25</div>
        <div class="text-[22px] text-slate-300 mt-1">每卖 1 块留下</div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>这 0.25 块还要覆盖销售、管理、融资和税费。毛利不是<span class="mark-sage">净利润</span>。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>06 / 08 · 利润表</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
