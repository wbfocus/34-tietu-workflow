<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P8：先下车间</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board-cover">
    <div class="relative">
      <div class="wm-num ui-title">08</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">08</div>
        <div>
          <div class="c-en sage ui-bold">LOCK</div>
          <div class="c-cn">先下车间</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">表面是数学问题<br/>本质是业务问题</h1>
      <p class="text-[26px] text-slate-300 mt-3">分配标准选什么，取决于你懂不懂工艺、设备和人员结构。</p>
    </div>
    <div class="card-paper p-6 flex items-center gap-5">
      <div class="idx-sq terra ui-bold">01</div>
      <div>
        <div class="text-[22px] text-slate-400 ui-bold">归集</div>
        <div class="text-[30px] text-white ui-title">范围对不对，修理费有没有混</div>
      </div>
    </div>
    <div class="card-paper p-6 flex items-center gap-5 w-[94%] ml-auto">
      <div class="idx-sq sage ui-bold">02</div>
      <div>
        <div class="text-[22px] text-slate-400 ui-bold">分配</div>
        <div class="text-[30px] text-white ui-title">标准跟费用动因匹不匹配</div>
      </div>
    </div>
    <div class="card-paper p-6 flex items-center gap-5 w-[88%] ml-auto">
      <div class="idx-sq ochre ui-bold">03</div>
      <div>
        <div class="text-[22px] text-slate-400 ui-bold">验证</div>
        <div class="text-[30px] text-white ui-title">重算一遍，再换标准对照</div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>只会看账、不下车间，表做得再漂亮也是花架子。下次先下车间，<span class="mark">再看账</span>。</p>
    </div>
    <div class="pill-dark px-8 py-6 text-center">
      <div class="text-[24px] text-white/70 ui-bold">点赞 · 收藏 · 转发给</div>
      <div class="text-[30px] text-white ui-title mt-2 leading-snug">还在全公司按产量一锅烩的同事</div>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>08 / 08 · 收口</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
