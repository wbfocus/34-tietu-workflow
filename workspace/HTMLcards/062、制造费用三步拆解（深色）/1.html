<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1：封面-制造费用三步</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board-cover">
    <div class="relative">
      <div class="wm-num ui-title">01</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">01</div>
        <div>
          <div class="c-en ui-bold">POOL</div>
          <div class="c-cn">成本蓄水池</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[52px] text-white leading-[1.12] ui-title">制造费用怎么拆？<br/>归集、分配、验证</h1>
      <p class="text-[28px] text-slate-300 mt-4 leading-relaxed">折旧、能耗、维修、车间管理人员工资，不像材料那样能一眼跟到产品。</p>
    </div>
    <div class="pill-dark px-8 py-5 flex items-center gap-4">
      <span class="bg-[#FF7700] text-white text-[22px] ui-bold px-4 py-1.5 rounded-full">判断</span>
      <span class="text-[26px] wenkai leading-snug">看不见摸不着，分错了<span class="mark">毛利率就假</span></span>
    </div>
    <div class="flex items-center gap-8">
      <div class="hero-orb ui-title text-[92px] leading-none glow-num">3</div>
      <div>
        <div class="text-[32px] text-white ui-title leading-tight">三步走完<br/>间接费用才算清楚</div>
        <p class="text-[26px] text-slate-300 mt-3 leading-relaxed">先收对，再按<span class="mark-sage">受益</span>分，最后用数字验</p>
      </div>
    </div>
    <div class="flex flex-wrap gap-3">
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-white flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#0EA5E9]"></span>归集</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-white flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#0EA5E9]"></span>分配</span>
      <span class="card-paper px-4 py-3 text-[22px] ui-bold text-white flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#FF7700]"></span>验证</span>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>01 / 08 · 封面</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
