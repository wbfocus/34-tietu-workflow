<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P5：分配标准</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">05</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq terra ui-bold">05</div>
        <div>
          <div class="c-en ui-bold">RULE</div>
          <div class="c-cn">分配标准</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">费用跟谁挂钩<br/>就按谁的消耗量来分</h1>
      <p class="text-[26px] text-slate-300 mt-3">不同车间可以用不同标准。同一车间里，不同产品必须统一。</p>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="card-paper p-6">
        <div class="idx-sq terra ui-bold text-[26px] w-14 h-14 rounded-2xl">热</div>
        <div class="text-[22px] text-slate-400 ui-bold mt-4">熔铸挤压</div>
        <div class="text-[30px] text-white ui-title mt-1">按标准重量</div>
        <p class="text-[24px] text-slate-300 mt-2 leading-relaxed">熔化成型，费用跟重量强相关。</p>
      </div>
      <div class="card-paper p-6">
        <div class="idx-sq sage ui-bold text-[26px] w-14 h-14 rounded-2xl">冷</div>
        <div class="text-[22px] text-slate-400 ui-bold mt-4">机加装配</div>
        <div class="text-[30px] text-white ui-title mt-1">按定额工时</div>
        <p class="text-[24px] text-slate-300 mt-2 leading-relaxed">切削装配，重量不同耗时差不多。</p>
      </div>
    </div>
    <div class="hl-bar px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed">同一车间里 A 用机器工时、B 用产量，就是在<span class="mark">人为调节</span>成本。</p>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>既做冶炼又做机加，全公司统一按产量分，某一工序的成本必然<span class="mark-sage">失真</span>。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>05 / 08 · 标准</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
