<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P5：呆滞与报废</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai px-10 pt-9 pb-20">
  <div class="board">
  <div class="flex justify-between items-center">
    <span class="badge px-6 py-2.5 text-[26px] ui-bold"># 呆滞报废</span>
    <span class="text-[#1C1917] text-[28px] ui-bold">05 / 08</span>
  </div>
  <h1 class="text-[52px] text-[#1C1917] leading-[1.1] ui-title">账上的隐形毒瘤<br/><span class="text-[#0284C7]">超期无领用、无订单</span></h1>

  <div class="grid grid-cols-3 gap-4">
    <div class="rounded-2xl bg-[#ECFDF5] border border-emerald-200 p-6 text-center">
      <div class="text-[28px] ui-title text-emerald-700 mb-2">绿灯</div>
      <div class="text-[30px] ui-title text-[#1C1917] mb-1">30 天内</div>
      <p class="text-[26px] text-[#1C1917]">正常周转</p>
    </div>
    <div class="rounded-2xl bg-[#FFFBEB] border border-amber-200 p-6 text-center">
      <div class="text-[28px] ui-title text-amber-700 mb-2">黄灯</div>
      <div class="text-[30px] ui-title text-[#1C1917] mb-1">30–90 天</div>
      <p class="text-[26px] text-[#1C1917]">冻结新采购</p>
    </div>
    <div class="rounded-2xl bg-[#FFF4E6] border border-orange-200 p-6 text-center">
      <div class="text-[28px] ui-title text-[#FF7700] mb-2">红灯</div>
      <div class="text-[30px] ui-title text-[#1C1917] mb-1">90 天以上</div>
      <p class="text-[26px] text-[#1C1917]">强制处理清单</p>
    </div>
  </div>

  <div class="card-premium p-6 relative">
    <div class="text-[30px] text-[#1C1917] ui-title mb-2">呆滞特种部队</div>
    <p class="text-[26px] text-[#1C1917] leading-relaxed">副总牵头：研发看代用改制、销售看打折捆绑、采购看退换。判定无用就当废品卖掉——断臂求生好过温水煮青蛙。</p>
  </div>
  <div class="card-premium p-6 relative w-[94%] ml-auto">
    <div class="text-[30px] text-[#1C1917] ui-title mb-2">报废要穿透追责</div>
    <p class="text-[26px] text-[#1C1917] leading-relaxed">勾选责任：设计公差、采购劣材、生产未按 SOP。报废金额按比例扣该部门当月奖金包，一句「生产报废」不能结案。</p>
  </div>
  <div class="card-featured p-6 border-l-[6px] border-l-[#FF7700]">
    <p class="text-[28px] text-[#1C1917] leading-relaxed"><span class="mark">记住：</span>呆滞侵占库位和资金。断臂卖掉无用料，好过温水煮青蛙。</p>
  </div>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
