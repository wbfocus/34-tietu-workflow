<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1：封面-五维成本防御</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai pt-9 pb-20">
  <div class="absolute top-0 left-0 right-0 h-[200px] mesh">
    <div class="absolute inset-0 noise pointer-events-none"></div>
    <div class="flex justify-between items-start px-10 pt-9 relative z-10">
      <span class="bg-white/80 backdrop-blur-md px-6 py-2.5 rounded-full text-[26px] text-[#0284C7] ui-bold tracking-wide border border-white">老汪洞察 · 制造业成本</span>
      <span class="text-[#1C1917] text-[28px] ui-bold">01 / 08</span>
    </div>
  </div>

  <div class="relative z-10 px-10 mt-[168px] board-cover">
    <p class="text-[22px] ui-bold tracking-[0.28em] uppercase text-[#0284C7]/70">LEAN COST · FIVE AXES</p>
    <div class="flex items-center gap-8">
      <span class="num-glow text-[128px] ui-bold leading-none">5</span>
      <div>
        <h1 class="text-[60px] text-[#1C1917] leading-[1.08] ui-title">利润是管出来的<br/>不是赚出来的</h1>
        <p class="text-[30px] text-[#0284C7] ui-title mt-3">月底利润表，只是尸检报告</p>
      </div>
    </div>

    <div class="grid grid-cols-5 gap-3">
      <div class="card-premium p-5 text-center relative">
        <div class="text-[#0284C7] text-[26px] ui-bold mb-2">01</div>
        <div class="text-[#1C1917] text-[28px] ui-title">合同毛利</div>
      </div>
      <div class="card-premium p-5 text-center relative">
        <div class="text-[#0284C7] text-[26px] ui-bold mb-2">02</div>
        <div class="text-[#1C1917] text-[28px] ui-title">材料利用</div>
      </div>
      <div class="card-premium p-5 text-center relative">
        <div class="text-[#0284C7] text-[26px] ui-bold mb-2">03</div>
        <div class="text-[#1C1917] text-[28px] ui-title">存货周转</div>
      </div>
      <div class="card-premium p-5 text-center relative">
        <div class="text-[#0284C7] text-[26px] ui-bold mb-2">04</div>
        <div class="text-[#1C1917] text-[28px] ui-title">呆滞报废</div>
      </div>
      <div class="card-premium p-5 text-center relative">
        <div class="text-[#0284C7] text-[26px] ui-bold mb-2">05</div>
        <div class="text-[#1C1917] text-[28px] ui-title">仓库水源</div>
      </div>
    </div>

    <div class="flex flex-wrap gap-3">
      <span class="badge px-4 py-2 text-[24px] ui-bold">限额领料</span>
      <span class="badge px-4 py-2 text-[24px] ui-bold">扫码报工</span>
      <span class="badge px-4 py-2 text-[24px] ui-bold">余料二次利用</span>
      <span class="badge px-4 py-2 text-[24px] ui-bold">红黄绿预警</span>
      <span class="badge px-4 py-2 text-[24px] ui-bold">循环盘点</span>
    </div>
    <div class="card-featured p-8 border-l-[6px] border-l-[#FF7700]">
      <p class="text-[30px] text-[#1C1917] leading-relaxed">
        <span class="mark-sage">老汪洞察：</span>
        微利时代，利润是在车间、仓库、业务链里<span class="mark">省</span>出来的。成本管控要做前置的<span class="mark">活体监测</span>，别等月底再开尸检会。
      </p>
    </div>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
