<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6：仓库存放管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai px-10 pt-9 pb-20">
  <div class="board">
  <div class="flex justify-between items-center">
    <span class="badge px-6 py-2.5 text-[26px] ui-bold"># 仓库水源地</span>
    <span class="text-[#1C1917] text-[28px] ui-bold">06 / 08</span>
  </div>
  <h1 class="text-[52px] text-[#1C1917] leading-[1.1] ui-title">仓库一乱<br/><span class="text-[#0284C7]">前面的成本数据全盘皆输</span></h1>

    <div class="card-premium p-6 flex gap-5 relative">
      <div class="step-num w-[72px] h-[72px] flex items-center justify-center text-white text-[30px] ui-bold flex-shrink-0">01</div>
      <div>
        <div class="text-[32px] text-[#1C1917] ui-title">日循环盘点，别年终停工</div>
        <p class="text-[26px] text-[#1C1917] leading-relaxed mt-2">每天抽 A 类高价值、B 类易变动几十个。差异当天查明，差异率压到千分之一以内。</p>
      </div>
    </div>
    <div class="card-premium p-6 flex gap-5 relative">
      <div class="step-num w-[72px] h-[72px] flex items-center justify-center text-white text-[30px] ui-bold flex-shrink-0">02</div>
      <div>
        <div class="text-[32px] text-[#1C1917] ui-title">FIFO 用系统锁死</div>
        <p class="text-[26px] text-[#1C1917] leading-relaxed mt-2">WMS + PDA：扫错批次、不是最早批次，直接报警锁出库。三定库位，找一颗螺丝不超过 30 秒。</p>
      </div>
    </div>
    <div class="card-premium p-6 flex gap-5 relative">
      <div class="step-num w-[72px] h-[72px] flex items-center justify-center text-white text-[30px] ui-bold flex-shrink-0">03</div>
      <div>
        <div class="text-[32px] text-[#1C1917] ui-title">交接零容忍</div>
        <p class="text-[26px] text-[#1C1917] leading-relaxed mt-2">当面点清、签字画押。车间接收后短少损坏一律车间负责，杜绝互相甩锅。</p>
      </div>
    </div>
    <div class="card-featured p-6 w-[94%] ml-auto border-l-[6px] border-l-[#FF7700]">
      <p class="text-[28px] text-[#1C1917] leading-relaxed">
        <span class="mark-sage">水源地：</span>账实、质量、效率都从仓库起。温湿度超标要报警，化学品隔离——不要考验人的记忆力。
      </p>
    </div>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
