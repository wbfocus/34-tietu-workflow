<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P7：五维齿轮与体检例会</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai px-10 pt-9 pb-20">
  <div class="board">
  <div class="flex justify-between items-center">
    <span class="badge px-6 py-2.5 text-[26px] ui-bold"># 五维齿轮</span>
    <span class="text-[#1C1917] text-[28px] ui-bold">07 / 08</span>
  </div>
  <h1 class="text-[52px] text-[#1C1917] leading-[1.1] ui-title">从事后算账<br/><span class="text-[#0284C7]">走向动态体检</span></h1>

  <div class="grid grid-cols-4 gap-4">
    <div class="card-premium p-5 text-center relative">
      <div class="text-[24px] text-[#0284C7] ui-bold mb-1">基础</div>
      <div class="text-[28px] text-[#1C1917] ui-title">仓储</div>
    </div>
    <div class="card-premium p-5 text-center relative">
      <div class="text-[24px] text-[#0284C7] ui-bold mb-1">过程</div>
      <div class="text-[28px] text-[#1C1917] ui-title">材料/工时</div>
    </div>
    <div class="card-premium p-5 text-center relative">
      <div class="text-[24px] text-[#0284C7] ui-bold mb-1">结果</div>
      <div class="text-[28px] text-[#1C1917] ui-title">周转/呆滞</div>
    </div>
    <div class="card-premium p-5 text-center relative">
      <div class="text-[24px] text-[#0284C7] ui-bold mb-1">落点</div>
      <div class="text-[28px] text-[#1C1917] ui-title">订单毛利</div>
    </div>
  </div>

  <div class="card-premium p-6 relative">
    <div class="text-[30px] text-[#1C1917] ui-title mb-4">每月一次「五维成本体检例会」</div>
    <div class="flex flex-col gap-3 text-[26px] text-[#1C1917] leading-relaxed">
      <p>厂长主持，财务主讲数据；工程、采购、生产、计划一把手到场。</p>
      <p>不听苦劳，只看指标。找出本月最差 3 个数，现场立 PDCA 专案。</p>
      <p>下月第一项议程：复盘上个月整改任务单。</p>
    </div>
  </div>
  <div class="card-featured p-6 border-l-[6px] border-l-[#FF7700]">
    <p class="text-[28px] text-[#1C1917] leading-relaxed">
      <span class="mark-sage">咬合：</span>仓储是基础 → 材料/工时是过程 → 周转/呆滞是结果 → 最终写进<span class="mark">订单毛利</span>。财务单打独斗管不好成本。
    </p>
  </div>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
