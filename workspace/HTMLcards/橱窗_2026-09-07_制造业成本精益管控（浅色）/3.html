<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3：材料利用率</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-b.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#faf8f5] relative box-border overflow-hidden wenkai px-10 pt-9 pb-20">
  <div class="board">
  <div class="flex justify-between items-center">
    <span class="badge px-6 py-2.5 text-[26px] ui-bold"># 材料利用率</span>
    <span class="text-[#1C1917] text-[28px] ui-bold">03 / 08</span>
  </div>
  <h1 class="text-[52px] text-[#1C1917] leading-[1.1] ui-title">利用率涨 1 个点<br/><span class="text-[#0284C7]">省下的基本是纯利</span></h1>

  <div class="grid grid-cols-2 gap-5">
    <div class="card-premium p-6 relative">
      <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#E0F2FE] to-[#BAE6FD] flex items-center justify-center text-[#0284C7] text-[30px] ui-bold mb-3">01</div>
      <div class="text-[30px] text-[#1C1917] ui-title mb-2">先锁标准基线</div>
      <p class="text-[26px] text-[#1C1917] leading-relaxed">试产 3–5 批测算，锁定理论最高利用率与正常浮动，禁止拍脑袋定指标。</p>
    </div>
    <div class="card-premium p-6 relative">
      <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#E0F2FE] to-[#BAE6FD] flex items-center justify-center text-[#0284C7] text-[30px] ui-bold mb-3">02</div>
      <div class="text-[30px] text-[#1C1917] ui-title mb-2">排版与余料库</div>
      <p class="text-[26px] text-[#1C1917] leading-relaxed">金属/板材用套裁软件，考核余料二次利用率；小单强制优先吃余料。</p>
    </div>
    <div class="card-premium p-6 relative">
      <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#E0F2FE] to-[#BAE6FD] flex items-center justify-center text-[#0284C7] text-[30px] ui-bold mb-3">03</div>
      <div class="text-[30px] text-[#1C1917] ui-title mb-2">水口与飞边</div>
      <p class="text-[26px] text-[#1C1917] leading-relaxed">回用比例写死。模具老化飞边增厚，会悄无声息吃掉原料。</p>
    </div>
    <div class="card-premium p-6 relative">
      <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#E0F2FE] to-[#BAE6FD] flex items-center justify-center text-[#0284C7] text-[30px] ui-bold mb-3">04</div>
      <div class="text-[30px] text-[#1C1917] ui-title mb-2">称重可视化</div>
      <p class="text-[26px] text-[#1C1917] leading-relaxed">班后废料过磅。利用率画 SPC 折线挂车间，跌破基线当天写 5-Why。</p>
    </div>
  </div>

  <div class="card-featured p-6 w-[94%] ml-auto border-l-[6px] border-l-[#FF7700]">
    <p class="text-[28px] text-[#1C1917] leading-relaxed">
      <span class="mark-sage">老汪提醒：</span>边角料、水口、废品都是看得见的浪费。跌破线当天要查：批次公差、刀具磨损，还是新人操作。
    </p>
  </div>
  </div>

  <div class="absolute bottom-6 left-0 w-full text-center text-[#1C1917]/40 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
