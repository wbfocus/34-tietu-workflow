<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2：两个节点</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">02</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">02</div>
        <div>
          <div class="c-en sage ui-bold">NODE</div>
          <div class="c-cn">两个节点</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">先分清：做完了<br/>还是卖掉了</h1>
      <p class="text-[26px] text-slate-300 mt-3">经营会上常把产量和利润绑在一起，其实是两个时点。</p>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="card-paper p-7">
        <div class="dot-n sage ui-bold">完</div>
        <div class="text-[22px] text-slate-400 ui-bold mt-4">车间节点</div>
        <div class="text-[30px] text-white ui-title mt-1">完工产品成本</div>
        <p class="text-[24px] text-slate-300 mt-2 leading-relaxed">本期已经<span class="mark-sage">完成生产</span>的产品成本。先进产成品仓库，售出后才转出。</p>
      </div>
      <div class="card-paper p-7">
        <div class="dot-n terra ui-bold">售</div>
        <div class="text-[22px] text-slate-400 ui-bold mt-4">销售节点</div>
        <div class="text-[30px] text-white ui-title mt-1">销货成本</div>
        <p class="text-[24px] text-slate-300 mt-2 leading-relaxed">本期已经<span class="mark">售出</span>商品的成本。进入利润表，用来算毛利。</p>
      </div>
    </div>
    <div class="card-blush p-6">
      <p class="text-[26px] text-slate-100 leading-relaxed">完工成本看「本期做完多少」。销货成本看「本期卖掉多少」。做完可以堆在仓库，<span class="mark">没卖掉就不进利润表</span>。</p>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>先跟着<span class="mark-sage">存货</span>走一遍，再记公式。成本是流出来的，不是一次背下来的。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>02 / 08 · 节点</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
