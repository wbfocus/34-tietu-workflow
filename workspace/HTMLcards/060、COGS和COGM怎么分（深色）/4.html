<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P4：制造商三类存货</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
  <link rel="stylesheet" href="theme-a.css"/>
</head>
<body>
<div class="w-[1080px] h-[1440px] bg-[#0a0f1a] relative box-border overflow-hidden wenkai pt-9 pb-20 px-10">
  <div class="absolute top-[-100px] left-[-60px] w-[680px] h-[680px] bg-cyan-500/28 rounded-full blur-[170px] z-0"></div>
  <div class="absolute bottom-[-80px] right-[-40px] w-[580px] h-[580px] bg-blue-600/22 rounded-full blur-[140px] z-0"></div>
  <div class="absolute inset-0 noise pointer-events-none z-[1]"></div>
  <div class="board">
    <div class="relative">
      <div class="wm-num ui-title">04</div>
      <div class="flex items-center gap-4 relative z-10">
        <div class="idx-sq sage ui-bold">04</div>
        <div>
          <div class="c-en sage ui-bold">PLANT</div>
          <div class="c-cn">制造商</div>
        </div>
      </div>
    </div>
    <div>
      <h1 class="text-[50px] text-white leading-[1.12] ui-title">三类存货，三项成本<br/>生产多出两个节点</h1>
      <p class="text-[26px] text-slate-300 mt-3">原材料 → 在产品 → 产成品 → <span class="mark">销货成本</span></p>
    </div>
    <div class="tier">
      <div class="tier-lab terra ui-bold">直接材料</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-slate-400 ui-bold">能追溯到产品</div>
        <div class="text-[28px] text-white ui-title">钢材、玻璃、轮胎这类，直接进产品</div>
      </div>
    </div>
    <div class="tier" style="width:96%">
      <div class="tier-lab sage ui-bold">直接人工</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-slate-400 ui-bold">直接参与生产</div>
        <div class="text-[28px] text-white ui-title">装配工、焊工、喷漆工的工资</div>
      </div>
    </div>
    <div class="tier" style="width:92%">
      <div class="tier-lab ochre ui-bold">制造费用</div>
      <div class="px-6 py-5">
        <div class="text-[22px] text-slate-400 ui-bold">间接生产成本</div>
        <div class="text-[28px] text-white ui-title">工厂租金、水电、生产主管、设备维护</div>
      </div>
    </div>
    <div class="card-principle px-6 py-5">
      <p class="text-[26px] text-slate-100 leading-relaxed"><span class="mark ui-title">原则：</span>制造费用只收<span class="mark-sage">生产环节</span>的间接成本。总部办公租金、销售工资、广告费，通常不算制造费用。</p>
    </div>
    <div class="c-foot ui-bold">
      <div><span class="c-foot-sq"></span>老汪洞察 · 信息图</div>
      <div>04 / 08 · 制造</div>
    </div>
  </div>
  <div class="absolute bottom-6 left-0 w-full text-center text-slate-600 text-[20px] ui-bold tracking-widest whitespace-nowrap z-50 pointer-events-none">@小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司</div>
</div>
</body>
</html>
