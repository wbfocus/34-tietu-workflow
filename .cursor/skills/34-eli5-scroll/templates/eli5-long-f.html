<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1, maximum-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-900.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-webfont-splitted@1.2.1/dist/HarmonyOS_Sans_SC/Bold/Bold.css"/>
<link rel="stylesheet" href="layout-long.css"/>
<link rel="stylesheet" href="theme-f-long.css"/>
</head>
<body>
<div class="phone" id="capture">
  <div class="chalk-mark" aria-hidden="true">粉笔</div>
  <div class="atm" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>
  <div class="wm" aria-hidden="true"></div>
  <div class="content wenkai">
    <header class="eli5-head" data-eli5-reveal>
      <div class="wm-num ui-title">01</div>
      <div class="head-row">
        <div class="idx-sq terra ui-bold">01</div>
        <div>
          <div class="c-en ui-bold">{{EN_TAG}}</div>
          <div class="c-cn">先记住一个比喻</div>
        </div>
      </div>
      <h1 class="ui-title">{{TITLE}}</h1>
      <p class="tagline">{{TAGLINE}}</p>
    </header>
    <section>
      <h2 data-eli5-reveal><span class="num terra ui-bold">1</span> 先记住一个比喻</h2>
      <div class="card-paper story" data-eli5-reveal>
        <div class="emoji">🍜</div>
        <div class="body">
          <div class="big ui-title">{{METAPHOR_TITLE}}</div>
          <p class="muted">{{METAPHOR_BODY}}</p>
        </div>
      </div>
    </section>
    <footer class="credit ui-bold" data-eli5-reveal>
      @小微之家会计服务 &nbsp;|&nbsp; @老汪洞察 &nbsp;|&nbsp; @汪斌带你开公司
      <div class="copy">仅供学习对照 · 非投资建议</div>
    </footer>
    <div class="c-foot ui-bold" data-eli5-reveal>
      <div><span class="c-foot-sq"></span>老汪洞察 · 石板</div>
      <div>长图信息</div>
    </div>
  </div>
</div>
</body>
</html>
